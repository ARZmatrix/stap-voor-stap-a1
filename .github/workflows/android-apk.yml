name: Android APK (Stap voor Stap A1)

on:
  push:
    branches: [nt2-a1-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nt2-a1-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/StapVoorStap-A1-v1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "out/StapVoorStap-A1.apk"

      # Second app from the same code: the basisexamen practice app, with its own app id so both can be installed.
      - name: Build Basisexamen Oefenen APK
        run: |
          sed -i "s/window.APP_MODE = 'course';/window.APP_MODE = 'exam';/" www/config.js
          grep -q "APP_MODE = 'exam'" www/config.js
          npx cap sync android
          sed -i 's/applicationId "nl.arzmatrix.stapvoorstap"/applicationId "nl.arzmatrix.basisexamen"/' android/app/build.gradle
          grep -q 'applicationId "nl.arzmatrix.basisexamen"' android/app/build.gradle
          sed -i 's|<string name="app_name">Stap voor Stap</string>|<string name="app_name">Basisexamen Oefenen</string>|; s|<string name="title_activity_main">Stap voor Stap</string>|<string name="title_activity_main">Basisexamen Oefenen</string>|' android/app/src/main/res/values/strings.xml
          cd android && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../out/Basisexamen-Oefenen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StapVoorStap-A1-apk
          path: |
            out/StapVoorStap-A1-v1.0.${{ github.run_number }}.apk
            out/Basisexamen-Oefenen.apk

      - name: Publish release (direct APK download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nt2-a1-v1.0.${{ github.run_number }}
          name: Stap voor Stap A1 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Twee Android-apps (Nederlands, NT2):
            - StapVoorStap-A1.apk: de cursus, niveau A0, A1 en A2.
            - Basisexamen-Oefenen.apk: oefenen voor het basisexamen inburgering buitenland (KNS, Lezen, Spreken).
            Download het bestand op je Android-telefoon en installeer.
            حمّل الملف على هاتف أندرويد وثبّته: StapVoorStap-A1.apk للمنهاج، و Basisexamen-Oefenen.apk للتدرب على الامتحان الأساسي.
          files: |
            out/StapVoorStap-A1.apk
            out/Basisexamen-Oefenen.apk

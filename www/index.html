<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Basisexamen Buitenland A1</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fff; --ink:#1b2333; --muted:#5f6b7d; --line:#e2ddd2;
  --blue:#14306b; --blue2:#21479a; --orange:#e8731a; --green:#1f8a4c; --red:#c2372e; --soft:#eef2fa;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header.top button{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px}
header.top .tt{flex:1;min-width:0}
header.top .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .tt small{opacity:.8;font-size:13px}
header.top .timer{font-variant-numeric:tabular-nums;background:var(--orange);padding:6px 10px;border-radius:10px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.ar{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;color:var(--muted);font-size:15px}
.ar.big{font-size:17px;color:var(--ink)}
h1{font-size:22px;margin:4px 0 2px} h2{font-size:18px;margin:0 0 6px} h3{font-size:16px;margin:12px 0 4px}
.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:inherit;color:inherit;cursor:pointer}
.tile .ic{font-size:26px} .tile b{display:block;margin-top:4px} .tile .ar{font-size:13px}
.tile.wide{grid-column:1/-1}
.tile.hero{background:var(--blue);color:#fff;border-color:var(--blue)} .tile.hero .ar,.tile.hero .muted{color:#d6def0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px} .bar i{display:block;height:100%;background:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:var(--soft);color:var(--blue)} .btn.or{background:var(--orange)} .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.block{width:100%} .btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.photo{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px;margin-bottom:12px;color:var(--blue2)}
.photo .ic{font-size:34px}
.q{font-size:20px;font-weight:600;margin:4px 0 10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:2px solid var(--line);background:#fff;border-radius:12px;font:inherit;margin-bottom:8px;cursor:pointer;color:inherit}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
.opt .ar{font-size:13px;margin-top:2px}
.opt.sel{border-color:var(--blue2);background:var(--soft)}
.opt.ok{border-color:var(--green);background:#e8f5ed} .opt.ok .k{background:var(--green);color:#fff}
.opt.no{border-color:var(--red);background:#fbeceb} .opt.no .k{background:var(--red);color:#fff}
.fb{border-radius:12px;padding:12px;margin-top:6px} .fb.ok{background:#e8f5ed} .fb.no{background:#fbeceb}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--blue)}
.pill.or{background:#fdebdc;color:#a24c09}
.text{white-space:pre-wrap;background:#fffdf7;border:1px dashed #d9cfb7;border-radius:12px;padding:14px;font-size:17px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dots button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}
.dots button.done{background:var(--soft);border-color:var(--blue2)} .dots button.cur{outline:2px solid var(--orange)}
.dots button.ok{background:#e8f5ed;border-color:var(--green)} .dots button.no{background:#fbeceb;border-color:var(--red)}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;cursor:pointer}
.rec.on{animation:pulse 1s infinite} @keyframes pulse{50%{box-shadow:0 0 0 12px rgba(194,55,46,.2)}}
.score{display:flex;gap:6px} .score button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit}
.score button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.big-num{font-size:44px;font-weight:800;color:var(--blue);line-height:1}
.warn{background:#fff6e6;border:1px solid #f1d39b;border-radius:12px;padding:12px;font-size:14px}
a{color:var(--blue2)}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
input[type=range]{width:140px}
.hide{display:none!important}
.btn[data-say]{flex:none;width:52px;height:48px;padding:0;font-size:20px}
.tag-src{font-size:12px;color:var(--muted)}
</style>
</head>

<header class="top"><button id="back" aria-label="Terug">←</button><div class="tt"><b id="title">Basisexamen A1</b><small id="subtitle"></small></div><span id="timer" class="timer hide"></span></header>
<main id="app"></main>
<script>
// KNS — 100 examenvragen + 2 voorbeeldvragen uit "Naar Nederland – Fotoboek" (herziene editie 2014,
// © Ministerie van SZW). Vraagtekst, opties en correct antwoord letterlijk overgenomen.
// Arabische vertaling/uitleg en neutrale fotobeschrijving: eigen toevoeging.
const KNS_THEMES = [
  {id:0, nl:"Voorbeeldvragen", ar:"أسئلة تجريبية", icon:"⭐"},
  {id:1, nl:"Nederland: geografie, vervoer en wonen", ar:"هولندا: الجغرافيا والمواصلات والسكن", icon:"🗺️"},
  {id:2, nl:"Geschiedenis", ar:"التاريخ", icon:"🏛️"},
  {id:3, nl:"Staatsinrichting, politiek en grondwet", ar:"نظام الدولة والسياسة والدستور", icon:"⚖️"},
  {id:4, nl:"Nederlandse taal", ar:"اللغة الهولندية", icon:"🗣️"},
  {id:5, nl:"Opvoeding en onderwijs", ar:"التربية والتعليم", icon:"🎒"},
  {id:6, nl:"Gezondheidszorg", ar:"الرعاية الصحية", icon:"🏥"},
  {id:7, nl:"Werk en inkomen", ar:"العمل والدخل", icon:"💼"}
];
const KNS = [
{id:"vb01",t:0,q:"U ziet de Nederlandse vlag. Wat zijn de kleuren van de Nederlandse vlag?",a:"rood, wit, blauw",b:"rood, wit, oranje",c:"A",f:"een vlag",qa:"ترى العلم الهولندي. ما هي ألوان العلم الهولندي؟",aa:"أحمر، أبيض، أزرق",ab:"أحمر، أبيض، برتقالي",x:"العلم الهولندي أحمر وأبيض وأزرق. البرتقالي هو لون العائلة المالكة (عائلة أورانيا)، وليس لون العلم."},
{id:"vb02",t:0,q:"U ziet een foto. Wie is dit?",a:"Koningin Maxima",b:"Willem van Oranje",c:"B",f:"een oud schilderij van een man",qa:"ترى صورة. من هذا؟",aa:"الملكة ماكسيما",ab:"فيليم فان أورانيا",x:"الصورة لوحة قديمة لرجل: فيليم فان أورانيا (ويليام الأورانجي)، يُعتبر «أب الوطن»."},
// 1 — Geografie, vervoer en wonen
{id:"1",t:1,q:"In welk deel van de wereld ligt Nederland?",a:"Europa",b:"Zuid-Amerika",c:"A",qa:"في أي جزء من العالم تقع هولندا؟",aa:"أوروبا",ab:"أمريكا الجنوبية",x:"هولندا دولة في غرب أوروبا."},
{id:"2",t:1,q:"Welk land ligt ten zuiden van Nederland?",a:"België",b:"Duitsland",c:"A",qa:"أي دولة تقع جنوب هولندا؟",aa:"بلجيكا",ab:"ألمانيا",x:"بلجيكا في الجنوب، وألمانيا في الشرق."},
{id:"3",t:1,q:"Welk land ligt ten oosten van Nederland?",a:"België",b:"Duitsland",c:"B",qa:"أي دولة تقع شرق هولندا؟",aa:"بلجيكا",ab:"ألمانيا",x:"ألمانيا في الشرق (oosten = الشرق)."},
{id:"4",t:1,q:"Welk land is groter?",a:"Marokko",b:"Nederland",c:"A",qa:"أي دولة أكبر؟",aa:"المغرب",ab:"هولندا",x:"هولندا دولة صغيرة جداً، المغرب أكبر منها بكثير."},
{id:"5",t:1,q:"Welk land is kleiner?",a:"Nederland",b:"Turkije",c:"A",qa:"أي دولة أصغر؟",aa:"هولندا",ab:"تركيا",x:"هولندا أصغر من تركيا بكثير."},
{id:"6",t:1,q:"Wat betekent Nederland?",a:"laag land",b:"waterland",c:"A",qa:"ماذا تعني كلمة «Nederland»؟",aa:"أرض منخفضة",ab:"أرض الماء",x:"Neder = منخفض، land = أرض. جزء كبير من هولندا تحت مستوى سطح البحر."},
{id:"7",t:1,q:"Kijk naar de foto. Wat is dit?",a:"een dijk",b:"een haven",c:"A",f:"een lange hoge wal van aarde langs het water",qa:"انظر إلى الصورة. ما هذا؟",aa:"سدّ (dijk)",ab:"ميناء",x:"الـ dijk هو سدّ ترابي طويل يحمي الأرض من مياه البحر والأنهار."},
{id:"8",t:1,q:"Wat gebeurt er met Nederland als er geen dijken zijn?",a:"Nederland krijgt meer regen",b:"Nederland staat onder water",c:"B",qa:"ماذا يحدث لهولندا إذا لم تكن هناك سدود؟",aa:"تحصل هولندا على مطر أكثر",ab:"تغرق هولندا تحت الماء",x:"بدون السدود يغمر الماء جزءاً كبيراً من البلد لأنه منخفض."},
{id:"9",t:1,q:"Welke stad ligt in de Randstad?",a:"Eindhoven",b:"Utrecht",c:"B",qa:"أي مدينة تقع في «الراندستاد»؟",aa:"آيندهوفن",ab:"أوتريخت",x:"الراندستاد هي منطقة المدن الكبرى في الغرب: أمستردام، روتردام، لاهاي، أوتريخت."},
{id:"10",t:1,q:"In Nederland, wonen daar veel mensen of weinig mensen?",a:"veel mensen",b:"weinig mensen",c:"A",qa:"في هولندا، هل يسكن فيها ناس كثيرون أم قليلون؟",aa:"ناس كثيرون",ab:"ناس قليلون",x:"هولندا من أكثر دول العالم كثافة سكانية."},
{id:"11",t:1,q:"Wat is de hoofdstad van Nederland?",a:"Amsterdam",b:"Den Haag",c:"A",qa:"ما هي عاصمة هولندا؟",aa:"أمستردام",ab:"لاهاي",x:"العاصمة هي أمستردام، أما الحكومة والبرلمان ففي لاهاي (Den Haag)."},
{id:"12",t:1,q:"In welke stad zit de regering van Nederland?",a:"Den Haag",b:"Rotterdam",c:"A",qa:"في أي مدينة توجد حكومة هولندا؟",aa:"لاهاي",ab:"روتردام",x:"الحكومة في لاهاي (Den Haag)."},
{id:"13",t:1,q:"Waar woont de koning van Nederland?",a:"Groningen",b:"Zuid-Holland",c:"B",qa:"أين يسكن ملك هولندا؟",aa:"خرونينغن",ab:"جنوب هولندا (زاود-هولاند)",x:"الملك يسكن في لاهاي، وهي في مقاطعة Zuid-Holland."},
{id:"14",t:1,q:"Waar ligt de grootste zeehaven van Nederland?",a:"Amsterdam",b:"Rotterdam",c:"B",qa:"أين يقع أكبر ميناء بحري في هولندا؟",aa:"أمستردام",ab:"روتردام",x:"ميناء روتردام هو الأكبر في هولندا وأوروبا."},
{id:"15",t:1,q:"Hoe heet de nationale luchthaven van Nederland?",a:"Europoort",b:"Schiphol",c:"B",qa:"ما اسم المطار الوطني لهولندا؟",aa:"يوروبورت",ab:"سخيبهول",x:"المطار الوطني هو Schiphol. أما Europoort فهو جزء من ميناء روتردام."},
{id:"16",t:1,q:"Waar ligt Schiphol?",a:"Amsterdam",b:"Rotterdam",c:"A",qa:"أين يقع مطار سخيبهول؟",aa:"أمستردام",ab:"روتردام",x:"مطار سخيبهول قرب أمستردام."},
{id:"17",t:1,q:"Wie helpt u als u in Nederland aankomt?",a:"de regering",b:"mijn partner",c:"B",qa:"من يساعدك عندما تصل إلى هولندا؟",aa:"الحكومة",ab:"شريكي/شريكتي",x:"شريك حياتك (الكفيل) هو من يساعدك عند الوصول، وليس الحكومة."},
{id:"18",t:1,q:"Is Nederland vaak droog of nat?",a:"droog",b:"nat",c:"B",qa:"هل هولندا غالباً جافة أم ممطرة (رطبة)؟",aa:"جافة",ab:"رطبة/ممطرة",x:"الطقس في هولندا ممطر كثيراً."},
{id:"19",t:1,q:"Als u naar Nederland komt, moet u dan opnieuw uw rijbewijs halen?",a:"ja",b:"nee",c:"A",qa:"عندما تأتي إلى هولندا، هل يجب أن تحصل على رخصة القيادة من جديد؟",aa:"نعم",ab:"لا",x:"الجواب الرسمي في الامتحان: نعم."},
{id:"20",t:1,q:"In Nederland, zijn de wegen daar druk of rustig?",a:"druk",b:"rustig",c:"A",qa:"في هولندا، هل الطرق مزدحمة أم هادئة؟",aa:"مزدحمة",ab:"هادئة",x:"الطرق في هولندا مزدحمة."},
{id:"21",t:1,q:"In Nederland, zijn daar veel fietsen of weinig fietsen?",a:"veel",b:"weinig",c:"A",qa:"في هولندا، هل توجد دراجات كثيرة أم قليلة؟",aa:"كثيرة",ab:"قليلة",x:"في هولندا دراجات كثيرة جداً."},
{id:"22",t:1,q:"Wat is typisch Nederlands in het verkeer?",a:"boten",b:"fietsen",c:"B",qa:"ما الشيء الهولندي النموذجي في حركة المرور؟",aa:"القوارب",ab:"الدراجات",x:"الدراجة (fiets) رمز هولندي في المرور."},
{id:"23",t:1,q:"Leven Nederlanders veel binnen of buiten?",a:"binnen",b:"buiten",c:"A",qa:"هل يعيش الهولنديون كثيراً داخل البيت أم خارجه؟",aa:"داخل البيت",ab:"خارج البيت",x:"بسبب الطقس يقضي الهولنديون وقتاً كثيراً داخل البيت."},
// 2 — Geschiedenis
{id:"24",t:2,q:"Wie ziet u op het plaatje?",a:"de Koning van Spanje",b:"Willem van Oranje",c:"B",f:"een oud schilderij van een man",qa:"من ترى في الصورة؟",aa:"ملك إسبانيا",ab:"فيليم فان أورانيا",x:"فيليم فان أورانيا قاد التمرد ضد ملك إسبانيا."},
{id:"25",t:2,q:"Was de koning van Spanje katholiek of protestants?",a:"katholiek",b:"protestants",c:"A",qa:"هل كان ملك إسبانيا كاثوليكياً أم بروتستانتياً؟",aa:"كاثوليكي",ab:"بروتستانتي",x:"ملك إسبانيا كان كاثوليكياً."},
{id:"26",t:2,q:"Hoe lang duurde de oorlog met Spanje?",a:"8 jaar",b:"80 jaar",c:"B",qa:"كم استمرت الحرب مع إسبانيا؟",aa:"8 سنوات",ab:"80 سنة",x:"اسمها «حرب الثمانين عاماً» (Tachtigjarige Oorlog)."},
{id:"27",t:2,q:"Hoe lang bestaat de Nederlandse staat ongeveer?",a:"vijftig jaar",b:"vierhonderd jaar",c:"B",qa:"منذ كم سنة تقريباً توجد الدولة الهولندية؟",aa:"خمسين سنة",ab:"أربعمئة سنة",x:"الدولة الهولندية موجودة منذ حوالي 400 سنة."},
{id:"28",t:2,q:"Waren de VOC-schepen voor de handel of voor de visvangst?",a:"voor de handel",b:"voor de visvangst",c:"A",qa:"هل كانت سفن شركة VOC للتجارة أم لصيد السمك؟",aa:"للتجارة",ab:"لصيد السمك",x:"VOC = شركة الهند الشرقية الهولندية، شركة تجارية."},
{id:"29",t:2,q:"Wie schilderde dit schilderij?",a:"Rembrandt van Rijn",b:"Willem van Oranje",c:"A",f:"een beroemd oud schilderij",qa:"من رسم هذه اللوحة؟",aa:"رامبرانت فان راين",ab:"فيليم فان أورانيا",x:"رامبرانت رسّام هولندي مشهور. فيليم فان أورانيا لم يكن رساماً."},
{id:"30",t:2,q:"Is er in Nederland scheiding van kerk en staat?",a:"ja",b:"nee",c:"A",qa:"هل يوجد في هولندا فصل بين الكنيسة (الدين) والدولة؟",aa:"نعم",ab:"لا",x:"نعم، الدين والدولة منفصلان."},
{id:"31",t:2,q:"Door welk land is Nederland bezet tijdens de Tweede Wereldoorlog?",a:"Duitsland",b:"Engeland",c:"A",qa:"من أي دولة احتُلّت هولندا خلال الحرب العالمية الثانية؟",aa:"ألمانيا",ab:"إنجلترا",x:"ألمانيا احتلت هولندا من 1940 إلى 1945."},
{id:"32",t:2,q:"Welke grote Nederlandse stad is in 1940 gebombardeerd?",a:"Amsterdam",b:"Rotterdam",c:"B",qa:"أي مدينة هولندية كبيرة قُصفت عام 1940؟",aa:"أمستردام",ab:"روتردام",x:"روتردام قُصفت عام 1940."},
{id:"33",t:2,q:"Waarom is Anne Frank beroemd?",a:"Ze schreef een dagboek",b:"Ze was baas van een museum",c:"A",qa:"لماذا آنا فرانك مشهورة؟",aa:"كتبت مذكرات (يوميات)",ab:"كانت مديرة متحف",x:"آنا فرانك فتاة يهودية كتبت يوميات خلال الحرب."},
{id:"34",t:2,q:"Welke kolonie van Nederland werd onafhankelijk vlak na de Tweede Wereldoorlog?",a:"Indonesië",b:"Suriname",c:"A",qa:"أي مستعمرة هولندية استقلت بعد الحرب العالمية الثانية مباشرة؟",aa:"إندونيسيا",ab:"سورينام",x:"إندونيسيا بعد الحرب مباشرة، وسورينام عام 1975."},
{id:"35",t:2,q:"Uit welk land kwamen veel gastarbeiders?",a:"uit Engeland",b:"uit Turkije",c:"B",qa:"من أي بلد جاء كثير من العمال الضيوف؟",aa:"من إنجلترا",ab:"من تركيا",x:"جاء عمال كثيرون من تركيا (والمغرب)."},
{id:"36",t:2,q:"Welke kolonie van Nederland werd in 1975 onafhankelijk?",a:"Nederlandse Antillen",b:"Suriname",c:"B",qa:"أي مستعمرة هولندية استقلت عام 1975؟",aa:"جزر الأنتيل الهولندية",ab:"سورينام",x:"سورينام استقلت عام 1975."},
// 3 — Staatsinrichting, politiek en grondwet
{id:"37",t:3,q:"Wie zijn dit?",a:"koning Willem-Alexander en koningin Maxima",b:"prinses Beatrix en haar man Claus",c:"A",f:"een koning en een koningin van nu",qa:"من هؤلاء؟",aa:"الملك فيليم-ألكسندر والملكة ماكسيما",ab:"الأميرة بياتريكس وزوجها كلاوس",x:"الملك الحالي فيليم-ألكسندر وزوجته الملكة ماكسيما."},
{id:"38",t:3,q:"Uit welk land komt koningin Maxima?",a:"Argentinië",b:"Duitsland",c:"A",qa:"من أي بلد الملكة ماكسيما؟",aa:"الأرجنتين",ab:"ألمانيا",x:"الملكة ماكسيما من الأرجنتين."},

  } else draw();

// recorder
const Rec = {
  stream:null, mr:null, chunks:[], tmax:null,
  async start(onStop, maxSec){
    if (!navigator.mediaDevices || !window.MediaRecorder) { alert("Opnemen wordt niet ondersteund op dit toestel."); return false; }
    try { this.stream = this.stream || await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ alert("Geen toegang tot de microfoon. Geef toestemming in de instellingen.\nلا يوجد إذن للميكروفون."); return false; }
    this.chunks=[]; this.mr = new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.onstop = () => { clearTimeout(this.tmax); onStop(URL.createObjectURL(new Blob(this.chunks, {type:this.mr.mimeType||"audio/webm"}))); };
    this.mr.start(); if (maxSec) this.tmax = setTimeout(()=>this.stop(), maxSec*1000); return true;
  },
  stop(){ if (this.mr && this.mr.state==="recording") this.mr.stop(); },
  release(){ this.stop(); if (this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; } }
};

function sprTask(kind, idx){
  if (kind==="vr"){ const v = SPR_VRAGEN[idx]; return {prompt:v.q, ar:v.qa, model:v.m, modelAr:v.ma, say:v.q}; }
  const z = SPR_AANVUL[idx]; return {prompt:z.z, ar:"", model:z.z.replace(/\s*(\.\.\.|…|\.\.)\s*\??$/,"")+" "+z.m, modelAr:"", say:z.z};
}
function sprPractice(kind){
  const all = (kind==="vr"?SPR_VRAGEN:SPR_AANVUL).map((_,i)=>i); let order = shuffle(all); let i = 0;
  cleanup = () => Rec.release();
  const draw = () => {
    const idx = order[i], t = sprTask(kind, idx); setHead(kind==="vr"?"Vraag – antwoord":"Aanvulzinnen", `${i+1} / ${order.length}`);
    const val = {a:null,u:null};
    app.innerHTML = `<div class="card"><span class="pill">${kind==="vr"?"Vraag":"Maak de zin af"}</span>
      <div class="row" style="align-items:flex-start;margin-top:8px"><div class="q" style="flex:1">${esc(t.prompt)}</div>${spk(t.say)}</div>${ar(t.ar,"big")}
      <div style="text-align:center;margin:16px 0"><button class="rec" id="rec">🎙️</button><div class="muted" id="rs">Druk en spreek · اضغط وتكلّم</div><audio id="pl" controls class="hide" style="width:100%;margin-top:10px"></audio></div>
      <details id="md"><summary><b>Voorbeeldantwoord</b> · مثال على جواب</summary><div class="row" style="margin-top:6px"><div class="q" style="flex:1;font-size:18px">${esc(t.model)}</div>${spk(t.model)}</div>${ar(t.modelAr,"big")}</details>
      <div id="sc"></div></div>
      <div class="row"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>←</button><button class="btn" id="next">Volgende →</button></div>`;
    say(t.say);
    const rec = $("#rec"); let on = false;
    rec.onclick = async () => {
      if (!on){ speechStop(); const okk = await Rec.start(url=>{ on=false; rec.classList.remove("on"); rec.textContent="🎙️"; $("#rs").textContent="Luister en geef uzelf punten · استمع وقيّم نفسك"; const p=$("#pl"); p.src=url; p.classList.remove("hide"); $("#md").open=true;
          scoreWidget("sc", val, v=>{ if (v.a!=null && v.u!=null){ S.spreken[kind][idx]={a:v.a,u:v.u}; save(); } }); }, 60);
        if (okk){ on=true; rec.classList.add("on"); rec.textContent="⏹"; $("#rs").textContent="Opnemen… druk om te stoppen · جارٍ التسجيل"; } }
      else Rec.stop();
    };
    $("#prev").onclick=()=>{ Rec.stop(); i--; draw(); };
    $("#next").onclick=()=>{ Rec.stop(); if (i<order.length-1){ i++; draw(); } else back(); };
  };
  draw();
}
function sprExam(){
  const tasks = pick(SPR_VRAGEN.map((_,i)=>i),10).map(i=>({kind:"vr",idx:i})).concat(pick(SPR_AANVUL.map((_,i)=>i),12).map(i=>({kind:"az",idx:i})));
  const recs = {}; let i = 0;
  cleanup = () => Rec.release();
  const finish = () => { Rec.stop(); stopTimer(); setTimeout(()=>{ go(sprReview, tasks, recs); stack.splice(stack.length-2,1); }, 300); };
  const draw = () => {
    const tk = tasks[i], t = sprTask(tk.kind, tk.idx);
    setHead("Spreken proefexamen", `Opdracht ${i+1} / 22 · ${tk.kind==="vr"?"vraag":"aanvulzin"}`);
    app.innerHTML = `<div class="card"><span class="pill ${tk.kind==="az"?"or":""}">${i<10?"Deel 1 · Vraag en antwoord":"Deel 2 · Maak de zin af"}</span>
      <div class="row" style="align-items:flex-start;margin-top:8px"><div class="q" style="flex:1">${esc(t.prompt)}</div>${spk(t.say)}</div>
      <div style="text-align:center;margin:16px 0"><button class="rec" id="rec">🎙️</button><div class="muted" id="rs">${recs[i]?"Opgenomen ✓ (opnieuw = overschrijven)":"Druk en spreek"}</div></div></div>
      <div class="row"><button class="btn" id="next">${i===21?"Klaar → beoordelen":"Volgende →"}</button></div>`;
    say(t.say);
    const rec=$("#rec"); let on=false;
    rec.onclick = async () => {
      if (!on){ speechStop(); const okk = await Rec.start(url=>{ on=false; recs[i]=url; rec.classList.remove("on"); rec.textContent="🎙️"; $("#rs").textContent="Opgenomen ✓"; }, 60);
        if (okk){ on=true; rec.classList.add("on"); rec.textContent="⏹"; $("#rs").textContent="Opnemen…"; } }
      else Rec.stop();
    };
    $("#next").onclick=()=>{ Rec.stop(); setTimeout(()=>{ if (i<21){ i++; draw(); } else finish(); }, 200); };
  };
  setHead("Spreken proefexamen", "22 opdrachten · 30 minuten");
  app.innerHTML = `<div class="card"><h2>Instructie</h2><p>Deel 1: 10 vragen. Deel 2: 12 zinnen afmaken. Druk op 🎙️, spreek, druk op ⏹. U hebt 30 minuten. Daarna luistert u naar uw opnames en geeft u uzelf punten met het officiële beoordelingsmodel.</p>
   ${ar("الجزء 1: عشرة أسئلة. الجزء 2: إكمال 12 جملة. اضغط 🎙️ وتكلّم ثم اضغط ⏹. لديك 30 دقيقة. بعدها تستمع إلى تسجيلاتك وتقيّم نفسك حسب نموذج التقييم الرسمي. نصيحة: اطلب من شريكك أو صديق يتكلم الهولندية أن يقيّمك.")}
   <p class="tag-src">Maximaal 60 seconden per opname (instelling van deze app).</p></div><button class="btn or block" id="go">Start examen ▶</button>`;
  $("#go").onclick=()=>{ startTimer(30*60, finish); app.dataset.guard="Examen stoppen?"; draw(); };
}
function sprReview(tasks, recs){
  setHead("Spreken – beoordelen", "قيّم تسجيلاتك");
  const vals = tasks.map(()=>({a:null,u:null}));
  cleanup = () => Rec.release();
  app.innerHTML = `<div class="card"><p>Luister naar elke opname. Geef 0 of 1 punt voor <b>adequaatheid</b> en <b>uitspraak</b>. Maximaal 44 punten.</p>${ar("استمع إلى كل تسجيل وأعطِ 0 أو 1 للملاءمة و0 أو 1 للنطق. المجموع الأقصى 44 نقطة.")}</div>
   ${tasks.map((tk,j)=>{ const t=sprTask(tk.kind,tk.idx); return `<div class="card"><span class="pill">${j+1}</span> <b>${esc(t.prompt)}</b>
     ${recs[j]?`<audio controls src="${recs[j]}" style="width:100%;margin-top:8px"></audio>`:`<div class="warn" style="margin-top:8px">Geen opname → 0 punten</div>`}
     <div class="muted" style="margin-top:6px">Voorbeeld: ${esc(t.model)}</div><div id="sw${j}"></div></div>`; }).join("")}
   <div class="card" style="text-align:center"><div class="big-num" id="tot">0 / 44</div><p class="muted" id="todo"></p><button class="btn block" id="save">Opslaan</button>
   <p class="tag-src">Oefenscore. DUO maakt de officiële uitslag; de cesuur staat niet in de openbare bronnen.</p></div>`;
  const upd = () => { const tot = vals.reduce((s,v)=>s+(v.a||0)+(v.u||0),0); $("#tot").textContent = `${tot} / 44`; const open = vals.filter((v,j)=>recs[j] && (v.a==null||v.u==null)).length; $("#todo").textContent = open?`Nog ${open} opdrachten beoordelen`:"Alles beoordeeld"; return tot; };
  tasks.forEach((tk,j)=>{ if (recs[j]) scoreWidget("sw"+j, vals[j], upd); else { vals[j].a=0; vals[j].u=0; } });
  upd();
  $("#save").onclick=()=>{ const tot=upd(); S.sprExams.push({d:Date.now(), n:tot}); tasks.forEach((tk,j)=>{ if (vals[j].a!=null && vals[j].u!=null) S.spreken[tk.kind][tk.idx]={a:vals[j].a,u:vals[j].u}; }); save(); alert(`Opgeslagen: ${tot}/44`); back(); };
}

function settings(){
  setHead("Instellingen", "الإعدادات");
  app.innerHTML = `<div class="card">
   <div class="toggle"><span>Arabische uitleg tonen<br><span class="ar">عرض الشرح بالعربية</span></span><input type="checkbox" id="ar" ${S.set.ar?"checked":""}></div>
   <div class="toggle"><span>Spreeksnelheid<br><span class="muted" id="rv">${S.set.rate.toFixed(2)}×</span></span><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${S.set.rate}"></div>
   <div class="toggle"><span>Test de stem</span>${spk("Welkom in Nederland. Wat is de hoofdstad van Nederland?")}</div>
   <div class="toggle"><span>Stem: <span class="muted">${NTTS?(nativeNL===false?"Nederlands niet geïnstalleerd in de spraakengine":"spraakengine van de telefoon"):(nlVoice?esc(nlVoice.name):"geen Nederlandse stem gevonden")}</span></span></div>
  </div><button class="btn ghost block" id="reset">Voortgang wissen · مسح التقدم</button>`;
  $("#ar").onchange=e=>{ S.set.ar=e.target.checked; save(); };
  $("#rate").oninput=e=>{ S.set.rate=+e.target.value; $("#rv").textContent=S.set.rate.toFixed(2)+"×"; save(); };
  $("#reset").onclick=()=>{ if (confirm("Alle voortgang wissen?")){ const st=S.set; S=structuredClone(DEF); S.set=st; save(); alert("Gewist."); } };
}

// Android back button (Capacitor) + start
document.addEventListener("backbutton", ()=>back(app.dataset.guard||null));
try { const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (CapApp) CapApp.addListener("backButton", ()=>{ if (stack.length>1) back(app.dataset.guard||null); else CapApp.exitApp(); }); } catch(e) {}
stack=[[home,[]]]; run();

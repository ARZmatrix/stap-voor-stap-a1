<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stap voor Stap A1</title>
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2-variations"),url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
</style>
<style>
/* Layout: one column "lesson notebook" — day header, section strip as a timetable, content set as worksheet pages. Tokens follow the Claude Design canvas. */
:root{
  --paper:#F5F7FB; --sheet:#FFFFFF; --ink:#16233F; --muted:#5A6684; --line:#D9DFEC;
  --delft:#1F4BB8; --delft-soft:#E8EEFB; --tulip:#D9472B; --tulip-soft:#FCEAE5;
  --leaf:#1E7F4F; --leaf-soft:#E3F3EA; --sun:#F2B33D; --sun-soft:#FDF2DA;
  --on-delft:#FFFFFF; --on-tulip:#FFFFFF; --tulip-ink:#B3361C; --leaf-ink:#17663F; --sun-ink:#7A5300;
  --stage1:#DCE6FB; --stage2:#F3F6FD; --skin1:#E9B98F; --skin2:#B8805A; --shadow:rgba(22,35,63,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --sheet:#151D33; --ink:#E7ECF8; --muted:#A3AECB; --line:#2B3656;
  --delft:#7FA2FF; --delft-soft:#1E2C57; --tulip:#FF8A70; --tulip-soft:#3D2128;
  --leaf:#5FD39A; --leaf-soft:#133427; --sun:#F5C463; --sun-soft:#3B3122;
  --on-delft:#0E1424; --on-tulip:#0E1424; --tulip-ink:#FF9C86; --leaf-ink:#5FD39A; --sun-ink:#F5C463;
  --stage1:#1C2747; --stage2:#121A30; --skin1:#C99A73; --skin2:#9A6B4B; --shadow:rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1424; --sheet:#151D33; --ink:#E7ECF8; --muted:#A3AECB; --line:#2B3656;
  --delft:#7FA2FF; --delft-soft:#1E2C57; --tulip:#FF8A70; --tulip-soft:#3D2128;
  --leaf:#5FD39A; --leaf-soft:#133427; --sun:#F5C463; --sun-soft:#3B3122;
  --on-delft:#0E1424; --on-tulip:#0E1424; --tulip-ink:#FF9C86; --leaf-ink:#5FD39A; --sun-ink:#F5C463;
  --stage1:#1C2747; --stage2:#121A30; --skin1:#C99A73; --skin2:#9A6B4B; --shadow:rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.h{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;text-align:right;font-size:1.1em;line-height:1.6}
.mut{color:var(--muted)}
.small{font-size:15px}
.sec{font:700 14px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--delft);outline-offset:2px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:20px;height:20px}
.ico.xs{width:15px;height:15px;stroke-width:3}
.ico.xl{width:44px;height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.nowrap{flex-wrap:nowrap;align-items:flex-start}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* buttons */
.btn{min-height:52px;border-radius:var(--r);padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 17px/1.2 var(--f-body);border:0;text-decoration:none;text-align:center}
.btn-p{background:var(--delft);color:var(--on-delft)}
.btn-s{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-t{background:var(--delft-soft);color:var(--delft)}
.btn-sm{min-height:48px;padding:0 14px;font-size:16px}
.btn-w{width:100%}
.btn-2{flex-direction:column;gap:0;min-height:64px;width:100%;padding-block:8px}
.btn-2 .ln{display:flex;align-items:center;gap:10px}
.btn-2 .ar{font-size:17px;line-height:1.4;font-weight:600;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.round{width:48px;min-height:48px;height:48px;padding:0;border-radius:999px;flex:none}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;font-weight:700;font-size:15px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink);box-shadow:none}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf-ink);box-shadow:none}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--delft);border-radius:999px;transition:width .3s}
.bar.thin{height:8px}
.tip{background:var(--delft-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tip .nl{font-weight:700}
.notice{border:2px solid var(--sun);background:var(--sun-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{font-weight:700;min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--delft)}
details.more ol{margin:8px 0}

/* home */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--delft);color:var(--on-delft);display:flex;align-items:center;justify-content:center;flex:none}
.home{display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
.wbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wbars span{font-size:14px;font-weight:700;color:var(--muted)}
.today{box-shadow:0 0 0 2px var(--delft)}
.badge{flex:none;width:60px;height:60px;border-radius:var(--r);background:var(--delft-soft);color:var(--delft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge small{font:700 12px/1 var(--f-body);letter-spacing:.08em}
.badge b{font:800 28px/1.05 var(--f-display)}
.badge.sun{background:var(--sun-soft);color:var(--sun-ink)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{min-height:72px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 24px/1 var(--f-display);border:0;padding:6px 0;background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.tile small{font:700 13px/1 var(--f-body)}
.tile-done{background:var(--leaf-soft);box-shadow:none}
.tile-done .ico{color:var(--leaf-ink)}
.tile-part small{color:var(--sun-ink)}
.tile-part{box-shadow:inset 0 0 0 2px var(--sun)}
.tile-now{background:var(--delft);color:var(--on-delft);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--delft)}
.tile-next{color:var(--muted);box-shadow:none;border:1.5px dashed var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
.road{display:grid;border-left:3px solid var(--line);margin:10px 0 0 8px}
.road .st{position:relative;padding:0 0 18px 20px;display:grid;gap:4px}
.road .st::before{content:"";position:absolute;left:-9px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:3px solid var(--delft)}
.road .st.now::before{background:var(--delft)}
.src a{color:var(--delft);word-break:break-word}

/* day */
.dayhead{background:var(--sheet);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 14px}
.dayhead .wrap{display:flex;flex-direction:column;gap:12px}
.dtitle{display:flex;gap:12px;align-items:center}
.stripbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--sheet);padding:8px 0 12px;box-shadow:0 8px 18px var(--shadow)}
.strip{display:flex;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.cell{flex:1 0 80px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit}
.cell:last-child{border-right:0}
.cell .n{font:700 13px/1 var(--f-body);color:var(--muted);display:flex;align-items:center;gap:3px;height:16px}
.cell .l{font:700 15px/1.1 var(--f-body)}
.cell .a{font:500 16px/1.2 var(--f-ar)}
.cell-done .n{color:var(--leaf-ink)}
.cell-now{background:var(--delft);color:var(--on-delft)}
.cell-now .n{color:var(--on-delft)}
.daymain{display:flex;flex-direction:column;gap:16px;padding-top:16px;padding-bottom:40px}
.can{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.can .ib{flex:none;width:40px;height:40px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf-ink);display:flex;align-items:center;justify-content:center}
.ws{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ws-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:3px double var(--line)}
.ws-top .wsn{font-weight:700;font-size:15px}
.ws-body{padding:18px 16px 20px;display:flex;flex-direction:column;gap:16px}
.ws-foot{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

/* vocab */
.fc{position:relative;width:100%;min-height:300px;border-radius:18px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 18px;box-shadow:0 6px 0 -2px var(--paper),0 6px 0 0 var(--line),0 12px 0 -4px var(--paper),0 12px 0 -2px var(--line);margin-bottom:12px}
.fc-back{background:var(--delft-soft);border-color:var(--delft)}
.fc .word{font:700 40px/1.1 var(--f-body);text-align:center;overflow-wrap:anywhere}
.fc .arw{font-size:40px;line-height:1.3;font-weight:600;text-align:center}
.fc .hint{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);margin-top:6px}
.art{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--delft-soft);color:var(--delft);font-weight:700;font-size:16px}
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ctl button{min-height:76px;border-radius:var(--r);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 15px/1.1 var(--f-body);padding:6px 2px}
.ctl .btn-s{background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--line)}
.ctl .btn-t{background:var(--delft-soft);color:var(--delft)}
.ctl .btn-p{background:var(--delft);color:var(--on-delft)}
.ctl .a{font:500 15px/1.2 var(--f-ar)}
.vlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.v{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);min-height:64px}
.v .w{font-weight:700;font-size:18px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:700 14px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
td.ar{text-align:right}
.exl{display:flex;flex-direction:column;gap:10px}

/* stage ("video") */
.stage{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--stage1),var(--stage2));border:1px solid var(--line)}
.stage .place{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;background:var(--sheet);border-radius:99px;padding:4px 12px 4px 6px;font-size:14px;font-weight:700}
.stage .place .e{font-size:20px}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--line);opacity:.55}
.stage .ppl{position:absolute;inset:auto 0 6% 0;display:flex;justify-content:space-around;align-items:flex-end;padding-inline:6%}
.person{display:grid;justify-items:center;gap:4px;width:30%;max-width:150px;position:relative}
.person svg{width:100%;height:auto;overflow:visible}
.person .tag{font-size:13px;font-weight:700;background:var(--sheet);border-radius:99px;padding:2px 9px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.person .mouth{transform-box:fill-box;transform-origin:center}
.person.talk svg{animation:bob .5s ease-in-out infinite alternate}
.person.talk .mouth{animation:talk .18s ease-in-out infinite alternate}
.person.talk .tag{background:var(--delft);color:var(--on-delft)}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:var(--sheet);border:2px solid var(--delft);border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.35;width:max-content;max-width:min(240px,62vw);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.bubble.dots{font-size:18px;letter-spacing:2px;padding:2px 12px;color:var(--delft)}
.stage .bigicon{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(34px,9vw,64px);opacity:.9}
.stage .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,16vw,120px)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:4px;height:8px;border-radius:2px;background:currentColor;animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{to{height:18px}}
@media (prefers-reduced-motion:reduce){.person.talk svg,.person.talk .mouth,.eq i{animation:none}}
.seg{display:flex;padding:4px;gap:4px;border-radius:var(--r);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;min-height:48px;border:0;border-radius:11px;background:transparent;color:var(--ink);font:700 16px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 10px}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--sheet);box-shadow:0 0 0 2px var(--delft);color:var(--delft)}
.switch{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.switch input{width:24px;height:24px;accent-color:var(--delft)}
.caps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cline{display:flex;gap:10px;padding:10px 12px;border-radius:12px;align-items:flex-start}
.cline .who{flex:none;width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.who-a{background:var(--delft-soft);color:var(--delft)}
.who-b{background:var(--leaf-soft);color:var(--leaf-ink)}
.cline.cl-now{background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun)}
.cline.cl-now .nl{font-weight:700;font-size:19px}
.cline.cl-past .nl{color:var(--muted)}

/* questions */
.quiz{display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .qt{font:700 20px/1.3 var(--f-display)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:var(--r);background:var(--sheet);border:2px solid var(--line);color:var(--ink);font:700 18px/1.3 var(--f-body);text-align:left}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
.opt .ot{flex:1;min-width:0}
.opt .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--delft-soft);border-color:var(--delft)}
.opt[aria-pressed="true"] .k{background:var(--delft);color:var(--on-delft)}
.opt.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.ok .k{background:var(--leaf);color:var(--sheet)}
.opt.ok .st{color:var(--leaf-ink)}
.opt.bad{background:var(--tulip-soft);border-color:var(--tulip)}
.opt.bad .k{background:var(--tulip);color:var(--on-tulip)}
.opt.bad .st{color:var(--tulip-ink)}
.opt.off{color:var(--muted)}
.result{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px 0 4px}
.result .ar{text-align:center}
.ring-bg{fill:none;stroke:var(--line);stroke-width:14}
.ring{fill:none;stroke:var(--leaf);stroke-width:14;stroke-linecap:round}
.ring.low{stroke:var(--sun)}
.ring-t{font:800 40px var(--f-display);fill:var(--ink)}
.ring-s{font:700 15px var(--f-body);fill:var(--muted)}

/* reading */
.textcard{border:2px solid var(--ink);border-radius:var(--r);padding:16px;white-space:pre-line;background:var(--sheet);font-size:17px}
.textcard h4{margin:0 0 6px;font-family:var(--f-display);font-size:20px}

/* writing */
.field{width:100%;min-height:56px;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--sheet);color:var(--ink);font:400 19px/1.4 var(--f-body)}
.field:focus{outline:none;border-color:var(--delft);box-shadow:0 0 0 4px var(--delft-soft)}
textarea.field{min-height:160px;resize:vertical}
select.field{font-size:17px}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:700}
.formgrid{display:flex;flex-direction:column;gap:12px}
.checks{display:flex;flex-direction:column;gap:4px}
.checks label{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:6px 0}
.checks input{width:24px;height:24px;margin-top:1px;accent-color:var(--leaf);flex:none}
.model{border:2px dashed var(--leaf);border-radius:var(--r);padding:12px 14px;white-space:pre-line;background:var(--leaf-soft)}
.fb{border:2px solid var(--delft);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;background:var(--delft-soft)}
.wtask+.wtask{border-top:3px double var(--line);padding-top:18px}

/* speaking */
.task{display:flex;flex-direction:column;gap:14px}
.task+.task{border-top:3px double var(--line);padding-top:18px}
.prompt{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.prompt .pq{font-size:24px;font-weight:700;line-height:1.25}
.timer{display:inline-flex;align-items:center;min-height:48px;padding:0 14px;border-radius:var(--r);background:var(--paper);font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.timer.low{color:var(--tulip-ink);background:var(--tulip-soft)}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.recbtn{width:104px;height:104px;border-radius:999px;border:0;background:var(--tulip);color:var(--on-tulip);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px var(--tulip-soft)}
.recbtn.rec-on{box-shadow:0 0 0 8px var(--tulip-soft),0 0 0 16px var(--sheet),0 0 0 18px var(--tulip);animation:recp 1.2s ease-in-out infinite}
@keyframes recp{50%{opacity:.8}}
.reclbl{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.reclbl b{font-size:19px;display:flex;align-items:center;gap:8px}
.reclbl .ar{text-align:center}
.dot{width:10px;height:10px;border-radius:999px;background:var(--tulip);display:inline-block}
audio{width:100%}

/* settings */
.grp{display:flex;flex-direction:column;gap:8px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gh h2{font-size:20px}
.rad{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--sheet);width:100%;text-align:left;font:700 18px/1.3 var(--f-body);color:var(--ink)}
.rad .o{width:24px;height:24px;border-radius:999px;border:2px solid var(--muted);flex:none}
.rad[aria-checked="true"]{border-color:var(--delft);background:var(--delft-soft)}
.rad[aria-checked="true"] .o{border:7px solid var(--delft)}
.rad .ex{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.vcard{padding:12px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.vcard.on{border-color:var(--delft);background:var(--delft-soft)}
.vcard .rad{border:0;background:transparent;padding:0;min-height:48px}
.score-tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;font-weight:700;font-size:14px}
.sk{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 18px 10px 12px;border-radius:var(--r);background:var(--ink);color:var(--paper);font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.22);z-index:20;max-width:calc(100% - 32px)}
.toast .ti{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--leaf);color:var(--sheet);flex:none}
.toast .ar{font-size:17px;opacity:.9}
@media (max-width:380px){ .ctl button{font-size:14px} .fc .word{font-size:34px} }

<script>
(function(){
const C = window.COURSE;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');

/* ---------- icons (stroke SVG) ---------- */

  headphones:'<path d="M4 15v-3a8 8 0 0116 0v3M3 15.5A1.5 1.5 0 014.5 14H7v6H4.5A1.5 1.5 0 013 18.5zM21 15.5a1.5 1.5 0 00-1.5-1.5H17v6h2.5a1.5 1.5 0 001.5-1.5z"/>',

  quiz:'<path d="M12 3a9 9 0 110 18 9 9 0 010-18zM9.5 9.5a2.5 2.5 0 114 2c-1 .6-1.5 1.2-1.5 2.5M12 17h.01"/>'
};
const ic=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* ---------- storage (per viewer, optional) ---------- */
const KEY='svs-a1-v1';
let S = {help:'both', done:{}, scores:{}, exam:{}, theme:'auto', gender:'f'};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
if(S.help==='en') S.help='both';
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function applyTheme(){ const r=document.documentElement; if(S.theme==='light'||S.theme==='dark') r.dataset.theme=S.theme; else delete r.dataset.theme; }
applyTheme();

/* ---------- help language ---------- */
const AR=()=>S.help!=='nl';
function help(nl,ar){ const out=[]; if(S.help!=='ar' && nl) out.push(`<p>${esc(nl)}</p>`); if(S.help!=='nl' && ar) out.push(`<p class="ar" lang="ar">${esc(ar)}</p>`); return out.join(''); }
const arP=(t,st='')=>AR()&&t?`<p class="ar" lang="ar"${st?` style="${st}"`:''}>${esc(t)}</p>`:'';
const arS=t=>AR()?`<span class="a" dir="rtl" lang="ar">${esc(t)}</span>`:'';
const arB=t=>AR()?`<span class="ar" lang="ar">${esc(t)}</span>`:'';
const btn2=(nl,ar,icon='next')=>`<span class="ln">${esc(nl)}${icon?ic(icon):''}</span>${arB(ar)}`;

/* ---------- toast ---------- */
let tt; function toast(m,ar){ const t=$('#toast'); t.innerHTML=`<span class="ti">${ic('check','s')}</span><span>${esc(String(m).replace(/\s*✓\s*/g,''))}</span>${ar&&AR()?`<span class="ar" lang="ar">· ${esc(ar)}</span>`:''}`; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

/* ---------- deterministic option shuffle ---------- */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function shuffled(q){ const idx=q[1].map((_,i)=>i); let h=hash(q[0]+q[1].join('|')); for(let i=idx.length-1;i>0;i--){ h=Math.imul(h^(h>>>15),2246822507)>>>0; const j=h%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx; }

/* ---------- speech ---------- */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const NTTS = NATIVE && Capacitor.Plugins && Capacitor.Plugins.TextToSpeech;
const CANREC = NATIVE && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const TTS = { voices:[], nl:[], ok:false };
const QUAL=/(enhanced|premium|verbeterd|natural|neural|online|google)/i;
function afterVoices(){ document.querySelectorAll('[data-vnote]').forEach(n=>n.hidden=TTS.ok); document.querySelectorAll('[data-vsel]').forEach(fillVoiceSelect); }
function loadNativeVoices(){ return NTTS.getSupportedVoices().then(r=>{ const all=(r&&r.voices)||[];
    TTS.voices=all.map((v,i)=>({name:v.voiceURI, lang:v.lang, idx:i, local:v.localService}));
    TTS.nl=TTS.voices.filter(v=>/^nl([-_]|$)/i.test(v.lang)); const sc=v=>(/nl[-_]NL/i.test(v.lang)?2:0)+(v.local?1:0); TTS.nl.sort((a,b)=>sc(b)-sc(a)); TTS.ok=TTS.nl.length>0; afterVoices(); }).catch(()=>{}); }
function loadVoices(){ if(NTTS) return; if(!('speechSynthesis' in window)) return; TTS.voices=speechSynthesis.getVoices(); TTS.nl=TTS.voices.filter(v=>/^nl([-_]|$)/i.test(v.lang));
  const score=v=>(/nl[-_]NL/i.test(v.lang)?2:0)+(QUAL.test(v.name)?1:0); TTS.nl.sort((a,b)=>score(b)-score(a)); TTS.ok=TTS.nl.length>0; afterVoices(); }
if(NTTS){ loadNativeVoices(); setTimeout(loadNativeVoices,1500); document.addEventListener('resume',loadNativeVoices); }
try{ loadVoices(); if(!NTTS && 'speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; let tries=0; const iv=setInterval(()=>{ loadVoices(); if(TTS.ok||++tries>10) clearInterval(iv); },500); } }catch(e){}
const FEM=/(claire|ellen|fenna|colette|lotte|sanne|laura|google nederlands|female|vrouw)/i, MAL=/(xander|maarten|frank|arnaud|ruben|male|\bman\b)/i;
function voiceFor(g){ if(!TTS.nl.length) return null; const pick=S['voice'+g]; if(pick){ const v=TTS.nl.find(x=>x.name===pick); if(v) return v; }
  const f=TTS.nl.filter(v=>FEM.test(v.name)), m=TTS.nl.filter(v=>MAL.test(v.name)&&!FEM.test(v.name)); if(g==='f'&&f.length) return f[0]; if(g==='m'&&m.length) return m[0]; if(NTTS&&g==='m'&&TTS.nl.length>1){ const lc=TTS.nl.filter(v=>v.local&&/nl[-_]NL/i.test(v.lang)); return (lc[1]||TTS.nl[1]); } return TTS.nl[0]; }
let rate=1;
function speak(text,g,onend){ g=g||S.gender||'f';
  if(NTTS){ const v=voiceFor(g); const same=v && voiceFor('f')===voiceFor('m'); let done=false; const fin=()=>{ if(!done){ done=true; onend&&onend(); } };
    NTTS.speak({ text, lang:'nl-NL', rate:0.95*rate, pitch: same?(g==='m'?0.75:1.2):1, volume:1, voice: v? v.idx : -1, category:'playback' }).then(fin,fin); return; }
  if(!('speechSynthesis' in window)){ toast('Deze browser kan niet voorlezen'); onend&&onend(); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang='nl-NL'; const v=voiceFor(g); if(v) u.voice=v;
  const sameVoice = v && voiceFor('f')===voiceFor('m');
  u.pitch = sameVoice ? (g==='m'?0.75:1.2) : 1; u.rate = 0.95*rate;
  u.onend=()=>onend&&onend(); u.onerror=()=>onend&&onend(); speechSynthesis.speak(u); }
function stopSpeech(){ try{ if(NTTS){ NTTS.stop().catch(()=>{}); } else speechSynthesis.cancel(); }catch(e){} }
function fillVoiceSelect(sel){ const g=sel.dataset.vsel; const cur=(voiceFor(g)||{}).name;
  sel.innerHTML = TTS.nl.length ? TTS.nl.map((v,k)=>`<option value="${esc(v.name)}" ${v.name===cur?'selected':''}>${NTTS ? `Stem ${k+1} · ${esc(v.lang)}${v.local?'':' (online)'}` : `${esc(v.name.replace(/\s*\(.*?\)\s*/g,' ').trim())} · ${esc(v.lang)}${QUAL.test(v.name)?' ★':''}`}</option>`).join('') : '<option>Geen Nederlandse stem</option>'; sel.disabled=!TTS.nl.length; }
const PHONE_STEPS = `
  <details class="more"><summary>iPhone / iPad</summary>
    <ol class="stack small" style="gap:4px;padding-left:20px">
      <li>Instellingen → Toegankelijkheid → Gesproken materiaal → Stemmen → Nederlands.</li>
      <li>Kies Claire (vrouw) of Xander (man) en download de versie “Verbeterd” of “Premium”.</li>
      <li>Sluit deze pagina en open hem opnieuw. Kies de stem in Instellingen.</li>
      <li>Hoort u niets? Zet de stille modus uit en zet het volume hoger.</li></ol>
    <ol class="ar stack small" style="gap:4px;padding-right:20px">
      <li>الإعدادات ← تسهيلات الاستخدام ← المحتوى المنطوق ← الأصوات ← الهولندية (Nederlands).</li>
      <li>اختر Claire (صوت امرأة) أو Xander (صوت رجل) وحمّل النسخة «المحسّنة» أو «Premium».</li>
      <li>أغلق هذه الصفحة وافتحها من جديد، ثم اختر الصوت في الإعدادات.</li>
      <li>لا تسمع شيئًا؟ أوقف الوضع الصامت وارفع مستوى الصوت.</li></ol></details>
  <details class="more"><summary>Android</summary>
    <ol class="stack small" style="gap:4px;padding-left:20px">
      <li>Instellingen → zoek op “Tekst-naar-spraak”.</li>
      <li>Kies “Spraakservices van Google” als engine → tandwiel → Spraakgegevens installeren → Nederlands (Nederland).</li>
      <li>Sluit deze pagina en open hem opnieuw. Kies de stem in Instellingen.</li></ol>
    <ol class="ar stack small" style="gap:4px;padding-right:20px">
      <li>الإعدادات ← ابحث عن «تحويل النص إلى كلام».</li>
      <li>اختر «خدمات الكلام من Google» ← رمز الترس ← تثبيت بيانات الصوت ← الهولندية (هولندا).</li>
      <li>أغلق هذه الصفحة وافتحها من جديد، ثم اختر الصوت في الإعدادات.</li></ol></details>`;
const NATIVE_STEPS = `
  <ol class="stack small" style="gap:4px;padding-left:20px;margin:0">
    <li>Tik op de knop hieronder. Android opent de spraakinstellingen.</li>
    <li>Kies “Spraakservices van Google” → Spraakgegevens installeren → Nederlands (Nederland).</li>
    <li>Kom terug naar de app en kies de stem in Instellingen.</li></ol>
  <ol class="ar stack small" style="gap:4px;padding-right:20px;margin:0">
    <li>اضغط على الزر في الأسفل، سيفتح أندرويد إعدادات الكلام.</li>
    <li>اختر «خدمات الكلام من Google» ← تثبيت بيانات الصوت ← الهولندية (هولندا).</li>
    <li>ارجع إلى التطبيق واختر الصوت في الإعدادات.</li></ol>
  <button class="btn btn-s btn-w" data-vinstall>${ic('gear')}Stem installeren · تثبيت الصوت</button>`;
function stepsHTML(){ return NTTS ? NATIVE_STEPS : PHONE_STEPS; }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-vinstall]'); if(b&&NTTS) NTTS.openInstall().catch(()=>toast('Open Instellingen → Tekst-naar-spraak')); });
function wireVoices(root){ root.querySelectorAll('[data-vsel]').forEach(sel=>{ fillVoiceSelect(sel); sel.onchange=()=>{ S['voice'+sel.dataset.vsel]=sel.value; save(); toast('Stem gekozen','تم اختيار الصوت'); }; });
  root.querySelectorAll('[data-vtest]').forEach(b=>b.onclick=()=>{ stopSpeech(); speak(b.dataset.vtest==='f'?'Goedemorgen! Ik ben uw docent. Hoe gaat het met u?':'Goedemiddag. Ik woon in Veghel en ik leer Nederlands.', b.dataset.vtest); }); }
function voiceNote(){ return `<div class="notice" data-vnote ${TTS.ok?'hidden':''}><b>Geen Nederlandse stem gevonden · لا يوجد صوت هولندي</b>${help('Uw telefoon heeft nog geen Nederlandse stem. Daardoor klinkt het geluid niet goed. Volg deze stappen:','هاتفك لا يحتوي بعد على صوت هولندي، لذلك قد يكون النطق خاطئًا. اتبع هذه الخطوات:')}${stepsHTML()}</div>`; }

/* ---------- people drawing ---------- */
function personSVG(g,i){ const shirt = ['var(--delft)','var(--tulip)','var(--leaf)','var(--sun)'][i%4]; const skin = i%2? 'var(--skin2)':'var(--skin1)';
  const hair = g==='f' ? `<path d="M22 34c0-16 10-24 18-24s18 8 18 24v20c-4-6-6-14-6-20-8 2-16 2-24 0 0 6-2 14-6 20z" fill="var(--ink)" opacity=".85"/>` : `<path d="M24 30c0-12 8-18 16-18s16 6 16 18c-6-4-10-6-16-6s-10 2-16 6z" fill="var(--ink)" opacity=".85"/>`;
  return `<svg viewBox="0 0 80 120" aria-hidden="true"><path d="M8 120c0-26 14-44 32-44s32 18 32 44z" fill="${shirt}"/><rect x="34" y="62" width="12" height="16" fill="${skin}"/>${hair}<circle cx="40" cy="38" r="20" fill="${skin}"/><circle cx="33" cy="36" r="2.4" fill="var(--ink)"/><circle cx="47" cy="36" r="2.4" fill="var(--ink)"/><ellipse class="mouth" cx="40" cy="47" rx="5" ry="2.6" fill="var(--ink)"/></svg>`; }
function stageHTML(sceneKey, who, id){ const sc=C.SCENES[sceneKey]||{icon:'💬',label:''}; const keys=Object.keys(who);
  const people = keys.map((k,i)=>`<div class="person" data-k="${k}"><div class="bubble dots" hidden>…</div>${personSVG(who[k][1],i)}<span class="tag">${esc(who[k][0])}</span></div>`).join('');
  const mid = (sceneKey==='phone' && keys.length>1) ? `<div class="bigicon" aria-hidden="true">📞</div>` : (keys.length===1 ? `<div class="bigicon" aria-hidden="true" style="left:78%">${sc.icon}</div>`:'');
  return `<div class="stage" id="${id}" role="img" aria-label="Bewegende scène: ${esc(sc.label)}"><div class="floor"></div><div class="place"><span class="e" aria-hidden="true">${sc.icon}</span>${esc(sc.label)}</div>${mid}<div class="ppl">${people}</div></div>`; }
function playScene(stageId, lines, who, captions, done, onLine){ stopSpeech(); const st=document.getElementById(stageId); let i=0, alive=true;
  const clear=()=>st.querySelectorAll('.person').forEach(p=>{p.classList.remove('talk'); const b=p.querySelector('.bubble'); b.hidden=true;});
  function next(){ if(!alive) return; clear(); if(i>=lines.length){ onLine&&onLine(-1); done&&done(); return; } onLine&&onLine(i); const [k,txt,tts]=lines[i++]; const p=st.querySelector(`.person[data-k="${k}"]`);
    if(p){ p.classList.add('talk'); const b=p.querySelector('.bubble'); b.hidden=false; if(captions()){ b.textContent=txt; b.classList.remove('dots'); } else { b.textContent='…'; b.classList.add('dots'); } }
    speak(tts||txt, (who[k]||['','f'])[1], ()=>setTimeout(next,380)); }
  next(); return ()=>{ alive=false; stopSpeech(); clear(); onLine&&onLine(-1); }; }

function quizHTML(qs, id){ return `<div class="quiz" id="${id}">${qs.map((q,qi)=>{ const ord=shuffled(q); return `<section class="q" data-qi="${qi}"><h3 class="qt" dir="auto">${qi+1}. ${esc(q[0])}</h3><div class="opts">${ord.map((oi,pos)=>`<button class="opt" data-oi="${oi}" data-k="${'ABCD'[pos]}" aria-pressed="false"><span class="k">${'ABCD'[pos]}</span><span class="ot" dir="auto">${esc(q[1][oi])}</span><span class="st"></span></button>`).join('')}</div></section>`; }).join('')}
  <button class="btn btn-p btn-w" data-check="${id}">${ic('check')}Nakijken</button><div class="result" data-score="${id}" hidden aria-live="polite"></div></div>`; }
function resultHTML(ok,n){ const r=64, L=2*Math.PI*r, f=n?ok/n:0, good=f>=0.7;
  return `<svg width="150" height="150" viewBox="0 0 168 168" role="img" aria-label="${ok} van ${n} goed"><circle class="ring-bg" cx="84" cy="84" r="${r}"/><circle class="ring ${good?'':'low'}" cx="84" cy="84" r="${r}" stroke-dasharray="${(L*f).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 84 84)"/><text x="84" y="92" text-anchor="middle" class="ring-t">${ok}/${n}</text><text x="84" y="118" text-anchor="middle" class="ring-s">goed</text></svg>
   <h3 class="h" style="font-size:28px">${good?'Goed zo!':'Nog even oefenen'}</h3>${arP(good?'أحسنت!':'تدرّب قليلًا بعد')}<p>U hebt ${ok} van de ${n} vragen goed.</p>`; }
function wireQuiz(id, qs, onScore){ const box=document.getElementById(id); if(!box) return;
  box.addEventListener('click',e=>{ const o=e.target.closest('.opt'); if(o && !box.dataset.checked){ o.parentElement.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false')); o.setAttribute('aria-pressed','true'); }
    const c=e.target.closest('[data-check]'); if(!c) return; const res=box.querySelector('[data-score]');
    if(box.dataset.checked){ box.dataset.checked=''; box.querySelectorAll('.opt').forEach(x=>{ x.classList.remove('ok','bad','off'); x.disabled=false; x.setAttribute('aria-pressed','false'); x.querySelector('.k').textContent=x.dataset.k; x.querySelector('.st').innerHTML=''; }); c.innerHTML=`${ic('check')}Nakijken`; res.hidden=true; res.innerHTML=''; return; }
    let ok=0; box.querySelectorAll('.q').forEach(qel=>{ const q=qs[+qel.dataset.qi]; const sel=qel.querySelector('.opt[aria-pressed="true"]');
      qel.querySelectorAll('.opt').forEach(x=>{ const right=+x.dataset.oi===q[2]; x.setAttribute('aria-pressed','false');
        if(right){ x.classList.add('ok'); x.querySelector('.k').innerHTML=ic('check','s'); x.querySelector('.st').innerHTML=`${ic('check','s')}${x===sel?'Goed!':'Goed antwoord'}`; }
        else if(x===sel){ x.classList.add('bad'); x.querySelector('.k').innerHTML=ic('x','s'); x.querySelector('.st').innerHTML=`${ic('x','s')}Niet goed`; }
        else x.classList.add('off'); });
      if(sel && +sel.dataset.oi===q[2]) ok++; });
    box.dataset.checked='1'; c.innerHTML=`${ic('retry')}Opnieuw`; res.innerHTML=resultHTML(ok,qs.length); res.hidden=false; res.scrollIntoView({block:'center',behavior:'smooth'}); onScore&&onScore(ok,qs.length); }); }

        : `${m?`<span class="art">${esc(m[1].toLowerCase())}</span>`:''}<p class="word" lang="nl">${esc(m?m[2]:v[0])}</p><span class="hint">${ic('flip','s')}Tik om om te draaien</span>`;

     ${doneBtn('grammatica','Begrepen','فهمت')}`;
    body.innerHTML=h; body.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>{stopSpeech(); speak(g.ex[+b.dataset.ex][0].replace(/–/g,','));}));
  }
  else if(sec==='luisteren'){ const L=d.listen; let caps=false; const keys=Object.keys(L.who);
    h=`${instr('Lees eerst de vragen. Kijk en luister. Beantwoord dan de vragen.','Probeer te antwoorden na één keer luisteren. Luister daarna opnieuw als dat nodig is. Zet de ondertitels aan als het te moeilijk is.','اقرأ الأسئلة أولًا، ثم شاهد واستمع. حاول الإجابة بعد الاستماع مرة واحدة ثم أعد إذا احتجت. شغّل الترجمة إذا كان صعبًا.')}${voiceNote()}
     ${stageHTML(L.scene,L.who,'stg')}
     <div class="g2"><button class="btn btn-p" id="play"></button><button class="btn btn-s" id="stop">${ic('stop')}Stop</button></div>
     <div class="row between"><div class="seg" role="group" aria-label="Snelheid" style="flex:0 1 200px"><button data-rate="1" aria-pressed="${rate===1}">1×</button><button data-rate="0.75" aria-pressed="${rate===0.75}">0,75×</button></div>
       <label class="switch"><input type="checkbox" id="caps"> Ondertitels</label></div>
     <ol class="caps" id="capList" hidden aria-label="Ondertitels">${L.lines.map(l=>`<li class="cline"><span class="who who-${keys.indexOf(l[0])%2?'b':'a'}" aria-hidden="true">${esc((L.who[l[0]]||['?'])[0].replace(/^(Mevrouw|Meneer|De|Het)\s+/i,'').charAt(0))}</span><span class="nl" style="flex:1">${esc(l[1])}</span></li>`).join('')}</ol>
     <p class="sec" style="margin-top:4px">Vragen</p>
     ${quizHTML(L.qs,'lq')}
     <details class="more"><summary>Tekst van het gesprek (na het nakijken)</summary><div class="stack" style="gap:6px;margin-top:8px">${L.lines.map(l=>`<p><b style="color:var(--delft)">${esc(L.who[l[0]][0])}:</b> ${esc(l[1])}</p>`).join('')}</div></details>`;
    body.innerHTML=h;
    const pb=$('#play'), idle=`${ic('play')}Afspelen`; pb.innerHTML=idle;
    const hl=i=>{ body.querySelectorAll('.cline').forEach((x,k)=>{ x.classList.toggle('cl-now',k===i); x.classList.toggle('cl-past',i>=0&&k<i); x.setAttribute('aria-current',String(k===i)); }); if(i<0) pb.innerHTML=idle; else pb.innerHTML=`<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Speelt af…`; };
    $('#caps').addEventListener('change',e=>{ caps=e.target.checked; $('#capList').hidden=!caps; });
    pb.onclick=()=>{ if(stopFn) stopFn(); stopFn=playScene('stg',L.lines,L.who,()=>caps,null,hl); };
    $('#stop').onclick=()=>{ if(stopFn){stopFn();stopFn=null;} };
    body.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ rate=+b.dataset.rate; body.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
    wireQuiz('lq',L.qs,()=>markDone(d.id,'luisteren'));
  }
  else if(sec==='lezen'){ const R=d.read;
    h=`${instr('Lees de tekst en beantwoord de vragen.','Lees eerst de vraag en zoek dan het antwoord in de tekst. Zonder woordenboek, zoals bij het A2-examen.','اقرأ السؤال أولًا ثم ابحث عن الجواب في النص. بدون قاموس، مثل امتحان A2.')}
     <div class="textcard"><h4>${esc(R.title)}</h4>${esc(R.text)}</div>${quizHTML(R.qs,'rq')}`;
    body.innerHTML=h; wireQuiz('rq',R.qs,()=>markDone(d.id,'lezen'));
  }
  else if(sec==='schrijven'){ body.innerHTML=writeHTML(d.write,'w'+d.id); wireWrite(d.write,'w'+d.id,()=>markDone(d.id,'schrijven')); }
  else if(sec==='spreken'){ body.innerHTML=`${instr('Luister naar de vraag en antwoord hardop.','Net als bij het A2-examen Spreken hebt u ongeveer 1 minuut per antwoord. Neem uzelf op, luister terug en vergelijk met het voorbeeldantwoord.','مثل امتحان التحدث A2 لديك حوالي دقيقة لكل إجابة. سجّل صوتك بالهاتف واستمع إليه ثم قارنه بالإجابة النموذجية.')}${voiceNote()}${d.speak.map((s,i)=>speakHTML(s,i)).join('')}${doneBtn('spreken','Alles geoefend','تدرّبت على كل شيء')}`; d.speak.forEach((s,i)=>wireSpeak(s,i)); }
  else if(sec==='toets'){ body.innerHTML=`${instr('Quiz van vandaag','5 of 6 goed? Ga door naar de volgende dag. Minder? Herhaal eerst de woorden en de grammatica.','إذا حصلت على 5 أو 6 من 6 انتقل لليوم التالي. أقل من ذلك؟ راجع الكلمات والقواعد أولًا.')}${quizHTML(d.quiz,'tq')}`;
    wireQuiz('tq',d.quiz,(ok,n)=>{ S.scores[d.id]=[ok,n]; save(); markDone(d.id,'toets'); toast('Opgeslagen','تم الحفظ'); }); }
  else if(sec==='herhaling'){ const pool=[]; C.DAYS.forEach(x=>(x.quiz||[]).forEach(q=>pool.push(q))); const pick=pool.sort(()=>Math.random()-.5).slice(0,20);
    body.innerHTML=`${instr('Gemengde toets: 20 vragen uit alle dagen','Elke keer een nieuwe mix. Minder dan 14 van 20? Herhaal de dagen met de laagste score.','مزيج جديد في كل مرة. أقل من 14/20؟ ارجع إلى الأيام ذات الدرجات الأقل.')}${quizHTML(pick,'hq')}`;
    wireQuiz('hq',pick,(ok,n)=>{ S.scores[d.id]=[ok,n]; save(); markDone(d.id,'herhaling'); toast('Opgeslagen','تم الحفظ'); }); }
  body.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{ markDone(d.id,b.dataset.done); toast('Opgeslagen','تم الحفظ'); $('#nextSec').click(); }));

/* ---------- writing ---------- */
function writeHTML(w,id){ return `<div class="stack wtask">${instr(w.nl,w.task,w.ar)}
  ${w.form? `<div class="formgrid">${w.form.map((f,i)=>`<label class="fl">${esc(f)}<input class="field" type="text" id="${id}-f${i}" autocomplete="off" lang="nl"></label>`).join('')}</div>` : `<label class="fl">Uw tekst<textarea class="field" id="${id}-t" placeholder="Schrijf hier in het Nederlands…" lang="nl"></textarea></label><div class="mut small" id="${id}-wc">0 woorden</div>`}
  <p class="sec">Controlelijst</p><div class="checks">${w.check.map((c,i)=>`<label><input type="checkbox" id="${id}-c${i}"> <span>${esc(c)}</span></label>`).join('')}</div>
  <div class="g2"><button class="btn btn-s" id="${id}-show">${ic('eye')}Voorbeeld</button><button class="btn btn-p" id="${id}-done">${ic('check')}Klaar</button></div>
  <button class="btn btn-t btn-w" id="${id}-ai" hidden>Laat Claude nakijken</button>
  <div class="model" id="${id}-model" hidden></div><div class="fb" id="${id}-fb" hidden aria-live="polite"></div></div>`; }
function studentText(w,id){ if(w.form) return w.form.map((f,i)=>`${f}: ${($('#'+id+'-f'+i)||{}).value||''}`).join('\n'); return ($('#'+id+'-t')||{}).value||''; }
function wireWrite(w,id,onDone){
  const ta=$('#'+id+'-t'); if(ta) ta.addEventListener('input',()=>{ const n=(ta.value.trim().match(/\S+/g)||[]).length; $('#'+id+'-wc').textContent=n+' woorden'; });
  $('#'+id+'-show').onclick=()=>{ const m=$('#'+id+'-model'); m.hidden=!m.hidden; m.textContent='Voorbeeld:\n'+w.model; };
  $('#'+id+'-done').onclick=()=>{ onDone&&onDone(); toast('Opgeslagen','تم الحفظ'); };
  // optional feedback from Claude
  if(window.claude && window.claude.use){ window.claude.use('sample').then(sample=>{ if(!sample) return; const b=$('#'+id+'-ai'); if(!b) return; b.hidden=false;
    b.onclick=async()=>{ const txt=studentText(w,id).trim(); const fb=$('#'+id+'-fb'); if(txt.replace(/^.*?:\s*$/gm,'').trim().length<5){ toast('Schrijf eerst uw tekst'); return; }
      fb.hidden=false; fb.textContent='Claude leest uw tekst…'; b.disabled=true;
      const lang = S.help==='nl' ? 'very simple Dutch (CEFR A1)' : (S.help==='ar' ? 'simple Arabic' : 'simple Arabic, followed by the same feedback in very simple Dutch (CEFR A1)');
      const prompt=`You are a kind, precise NT2 teacher. The learner is at CEFR A1 and is a native Arabic speaker. Check this Dutch writing task in the style of the DUO A2 writing exam: did the learner answer every point of the task?\n\nTASK (Dutch): ${w.task}\nREQUIRED POINTS: ${w.check.join('; ')}\nEXAMPLE ANSWER (for reference only): ${w.model}\n\nLEARNER TEXT:\n${txt}\n\nReply in ${lang}. Format:\n1) Points covered / missing (list each required point with ✓ or ✗).\n2) Up to 5 corrections: wrong → right, with a very short reason.\n3) The corrected Dutch text.\n4) One tip.\nKeep it short. Do not invent errors.`;
      try{ await sample(prompt,{modelTier:'default',onText:({text})=>{ fb.textContent=text; }}); }catch(e){ fb.textContent = e&&e.code==='rate_limited' ? 'Even wachten en later opnieuw proberen.' : 'Nakijken lukt nu niet. Gebruik de controlelijst en het voorbeeld.'; }
      b.disabled=false; }; }).catch(()=>{}); }
}

/* ---------- recording (Android app) ---------- */
const recIdle=()=>`<b>Neem op</b>${arB('سجّل صوتك')}`;
function recHTML(key, fileAttr){ return CANREC ? `<div class="recwrap"><button class="recbtn" data-rec="${key}" aria-label="Neem op">${ic('mic','xl')}</button><p class="reclbl" aria-live="polite">${recIdle()}</p></div>`
  : `<label class="btn btn-s" style="align-self:flex-start">${ic('mic')}Opname kiezen of maken<input type="file" accept="audio/*" capture ${fileAttr} hidden></label>`; }
let activeRec=null;
function wireRec(btn, audio){ if(!btn) return; let mr=null, chunks=[]; const lbl=btn.parentElement.querySelector('.reclbl');
  btn.onclick=async()=>{ if(mr && mr.state==='recording'){ mr.stop(); return; }
    if(activeRec && activeRec!==btn){ toast('Stop eerst de andere opname','أوقف التسجيل الآخر أولًا'); return; }
    stopSpeech();
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); chunks=[]; mr=new MediaRecorder(st);
      mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      mr.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); activeRec=null; const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); audio.src=URL.createObjectURL(b); audio.hidden=false;
        btn.classList.remove('rec-on'); btn.innerHTML=ic('mic','xl'); btn.setAttribute('aria-label','Opnieuw opnemen'); lbl.innerHTML=`<b>Opnieuw opnemen</b>${arB('أعد التسجيل')}<span class="mut small">Luister hieronder naar uw opname.</span>`; };
      mr.start(); activeRec=btn; btn.classList.add('rec-on'); btn.innerHTML=ic('stopF','xl'); btn.setAttribute('aria-label','Stop opname');
      lbl.innerHTML=`<b><span class="dot" aria-hidden="true"></span>Ik luister…</b><span class="mut">Tik op het vierkant om te stoppen.</span>${arB('أستمع إليك… اضغط على المربّع للإيقاف.')}`;
      setTimeout(()=>{ if(mr&&mr.state==='recording') mr.stop(); },90000);
    }catch(e){ activeRec=null; toast('Geen toegang tot de microfoon','لا يوجد إذن للميكروفون'); } }; }
function wireFile(input, audio){ if(!input) return; input.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; audio.src=URL.createObjectURL(f); audio.hidden=false; }; }

/* ---------- speaking ---------- */
function speakHTML(s,i){ return `<section class="task" id="sp${i}"><p class="sec">Opdracht ${i+1} van ${view.name==='day'?(C.DAYS.find(x=>x.id===view.id).speak.length):''}</p>
  <div class="prompt"><p class="pq" lang="nl">${esc(s[0])}</p>${arP(s[1],'font-size:20px')}<button class="btn btn-t" data-q="${i}" style="align-self:flex-start">${ic('speaker2')}Luister naar de vraag</button></div>
  <div class="row"><button class="btn btn-s btn-sm" data-t="${i}">${ic('clock')}Start 1 minuut</button><span class="timer" id="tm${i}">1:00</span></div>
  ${recHTML('s'+i, `data-f="${i}"`)}
  <audio id="au${i}" controls hidden></audio>
  <details class="more"><summary>Voorbeeldantwoord</summary><div class="row nowrap" style="margin-top:8px;align-items:center"><button class="btn btn-t round" data-m="${i}" aria-label="Luister naar het voorbeeld">${ic('speaker')}</button><p>${esc(s[2])}</p></div></details></section>`; }
function startTimer(el,secs,lowAt,end){ clearInterval(timerInt); let t=secs; el.classList.remove('low'); const show=()=>el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; show();
  timerInt=setInterval(()=>{ t--; show(); if(t<=lowAt) el.classList.add('low'); if(t<=0){ clearInterval(timerInt); el.textContent=end; } },1000); }
function wireSpeak(s,i){ const root=$('#sp'+i);
  root.querySelector('[data-q]').onclick=()=>{stopSpeech(); speak(s[0].replace(/\(.*?\)/g,''),'f');};
  root.querySelector('[data-m]').onclick=()=>{stopSpeech(); speak(s[2].replace(/…/g,''),'m');};
  root.querySelector('[data-t]').onclick=()=>startTimer($('#tm'+i),60,10,'Tijd!');
  wireFile(root.querySelector('[data-f]'), $('#au'+i)); wireRec(root.querySelector('[data-rec]'), $('#au'+i));
}

/* ---------- EXAM ---------- */
const EXPARTS=[['lezen','Lezen','القراءة','book'],['luisteren','Luisteren','الاستماع','headphones'],['schrijven','Schrijven','الكتابة','pencil'],['spreken','Spreken','التحدّث','mic']];
function examResults(){ const E=C.EXAM, X=S.exam; if(!X.lezen&&!X.luisteren&&!X.schrijven&&!X.spreken) return '';
  const tag=(ok,txt)=>`<span class="score-tag" style="background:var(${ok?'--leaf-soft':'--sun-soft'});color:var(${ok?'--leaf-ink':'--sun-ink'})">${txt}</span>`;
  const row=(nl,s,pass)=>`<div class="sk"><span style="flex:1;font-weight:700">${nl}</span>${s?tag(s[0]>=pass,s[0]>=pass?'Goed genoeg':'Nog oefenen'):'<span class="mut small">Nog niet gedaan</span>'}<span style="width:56px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">${s?s.join('/'):'–'}</span></div>`;
  return `<section class="card" style="padding:14px 16px"><div class="gh" style="padding-bottom:6px"><h2 class="h" style="font-size:20px">Uw resultaten</h2>${arP('نتائجك')}</div>
    ${row('Lezen',X.lezen,E.lezen.pass)}${row('Luisteren',X.luisteren,E.luisteren.pass)}
    <div class="sk"><span style="flex:1;font-weight:700">Schrijven</span>${X.schrijven?tag(true,'Gedaan'):'<span class="mut small">Nog niet gedaan</span>'}<span style="width:56px"></span></div>
    ${row('Spreken',X.spreken,11)}
    <p class="mut small" style="padding-top:8px">Richtlijn: Lezen ${E.lezen.pass}, Luisteren ${E.luisteren.pass}, Spreken 11 van 16 punten.</p></section>`; }
function renderExam(){ const E=C.EXAM; const part=view.part; const pi=EXPARTS.findIndex(p=>p[0]===part);
  const mins={lezen:`${E.lezen.minutes} min`,luisteren:'± 20 min',schrijven:`${E.schrijven.minutes} min`,spreken:'± 15 min'};
  app.innerHTML=`<header class="dayhead"><div class="wrap">
    <div class="row between"><button class="btn btn-s btn-sm" data-home>${ic('home')}Home</button></div>
    <div class="dtitle"><div class="badge sun"><small>DAG</small><b>21</b></div><div style="flex:1;min-width:0"><h1 class="h" style="font-size:24px">Proefexamen</h1>${arP('الامتحان التجريبي','font-size:20px;line-height:1.4')}</div></div>
    <div class="stack" style="gap:4px">${help(E.note,E.noteAr)}</div></div></header>
   <nav class="stripbar" aria-label="Onderdelen van het examen"><div class="wrap"><div class="strip">${EXPARTS.map((p,i)=>cellHTML([p[0],p[1],0,p[2],p[3]],i,part===p[0]?'now':(S.exam[p[0]]?'done':''))).join('')}</div></div></nav>
   <div class="wrap daymain"><article class="ws"><div class="ws-top"><span class="sec">Examen ${pi+1} · ${EXPARTS[pi][1]}</span><span class="mut wsn">${mins[part]}</span></div><div class="ws-body" id="exBody"></div>
     ${pi<3?`<div class="ws-foot"><button class="btn btn-p btn-2" id="exNext">${btn2(`Volgende: ${EXPARTS[pi+1][1]}`,`التالي: ${EXPARTS[pi+1][2]}`)}</button></div>`:''}</article>${examResults()}</div>`;
  app.querySelectorAll('.strip .cell').forEach(t=>t.onclick=()=>go({name:'exam',part:t.dataset.sec}));
  const nx=$('#exNext'); if(nx) nx.onclick=()=>go({name:'exam',part:EXPARTS[pi+1][0]});
  const body=$('#exBody');
  const timerRow=min=>`<div class="row"><button class="btn btn-p" id="xt">${ic('clock')}Start ${min} min</button><span class="timer" id="xtm">${min}:00</span></div>`;
  if(part==='lezen'){ const all=[]; E.lezen.texts.forEach(t=>t.qs.forEach(q=>all.push(q)));
    body.innerHTML=`${instr(`Lezen — ${all.length} vragen, ${E.lezen.minutes} minuten`,`Start de timer. Richtlijn: ${E.lezen.pass} van ${all.length} of meer goed = klaar voor A2.`,`شغّل المؤقت. الإرشاد: ${E.lezen.pass}/${all.length} أو أكثر = جاهز لمواد A2.`)}
     ${timerRow(E.lezen.minutes)}
     ${E.lezen.texts.map(t=>`<div class="textcard"><h4>${esc(t.title)}</h4>${esc(t.text)}</div>`).join('')}
     ${quizHTML(all,'xl')}`;
    examTimer(E.lezen.minutes); wireQuiz('xl',all,(ok,n)=>{ S.exam.lezen=[ok,n]; save(); toast(ok>=E.lezen.pass?'Goed gedaan!':'Nog even oefenen'); });
    // place each text above its questions
    let qi=0; const box=$('#xl'); const cards=[...body.querySelectorAll('.textcard')]; E.lezen.texts.forEach((t,ti)=>{ const first=box.querySelector(`.q[data-qi="${qi}"]`); box.insertBefore(cards[ti],first); qi+=t.qs.length; });
  }
  if(part==='luisteren'){ const all=[]; E.luisteren.frags.forEach(f=>f.qs.forEach(q=>all.push(q)));
    body.innerHTML=`${instr(`Luisteren — ${all.length} vragen`,`Lees eerst de vragen. Speel elk fragment één keer af. Richtlijn: ${E.luisteren.pass} van ${all.length} of meer goed.`,`اقرأ الأسئلة ثم شغّل كل مقطع مرة واحدة. الإرشاد: ${E.luisteren.pass}/${all.length} أو أكثر.`)}${voiceNote()}
     ${E.luisteren.frags.map((f,fi)=>`<div class="stack"><p class="sec">Fragment ${fi+1}</p>${stageHTML(f.scene,f.who,'xs'+fi)}<div class="row"><button class="btn btn-p" data-xp="${fi}">${ic('play')}Afspelen</button><span class="mut small" id="xpc${fi}"></span></div></div>`).join('')}
     ${quizHTML(all,'xq')}`;
    let qi=0; const box=$('#xq'); E.luisteren.frags.forEach((f,fi)=>{ const blk=$('#xs'+fi).parentElement; box.insertBefore(blk, box.querySelector(`.q[data-qi="${qi}"]`)); qi+=f.qs.length; });
    const plays={}; body.querySelectorAll('[data-xp]').forEach(b=>b.onclick=()=>{ const fi=+b.dataset.xp, f=E.luisteren.frags[fi]; plays[fi]=(plays[fi]||0)+1; $('#xpc'+fi).textContent=`${plays[fi]}× afgespeeld`; if(stopFn) stopFn(); stopFn=playScene('xs'+fi,f.lines,f.who,()=>false); });
    wireQuiz('xq',all,(ok,n)=>{ S.exam.luisteren=[ok,n]; save(); toast(ok>=E.luisteren.pass?'Goed gedaan!':'Nog even oefenen'); });
  }
  if(part==='schrijven'){
    body.innerHTML=`${instr(`Schrijven — 3 opdrachten, ${E.schrijven.minutes} minuten`,'Bij het echte A2-examen schrijft u op papier. Oefen ook op papier en vergelijk daarna met het voorbeeld. Geef antwoord op alle punten.','في امتحان A2 الحقيقي تكتب على الورق. تدرّب على الورق أيضًا ثم قارن بالنموذج. أجب عن كل نقطة.')}
     ${timerRow(E.schrijven.minutes)}
     ${E.schrijven.tasks.map((t,i)=>writeHTML(t,'xw'+i)).join('')}`;
    examTimer(E.schrijven.minutes); E.schrijven.tasks.forEach((t,i)=>wireWrite(t,'xw'+i,()=>{ S.exam.schrijven=1; save(); }));
  }
  if(part==='spreken'){
    body.innerHTML=`${instr('Spreken — 8 opdrachten','Bij elke opdracht: luister, denk 10 seconden na en antwoord maximaal 1 minuut. Geef uzelf punten: 2 = antwoord in hele zinnen, 1 = gedeeltelijk, 0 = geen antwoord. Richtlijn: 11 van 16 punten.','لكل مهمة: استمع، فكّر 10 ثوانٍ، أجب حتى دقيقة. قيّم نفسك: 2 = أجبت بجمل كاملة، 1 = جزئيًا، 0 = لا إجابة. الإرشاد: 11 من 16 نقطة.')}${voiceNote()}
     ${E.spreken.tasks.map((t,i)=>`<section class="task" id="xsp${i}"><p class="sec">${esc(t.part)}</p>
       ${t.scene? stageHTML(t.scene,{A:t.who},'xst'+i) : `<div class="stage"><div class="pic" aria-hidden="true">${esc(t.pic)}</div></div>`}
       <div class="prompt"><p class="pq" lang="nl" style="font-size:21px">${esc(t.q)}</p>${arP(t.ar,'font-size:19px')}<button class="btn btn-t" data-xq="${i}" style="align-self:flex-start">${ic('speaker2')}Luister</button></div>
       <div class="row"><button class="btn btn-s btn-sm" data-xt="${i}">${ic('clock')}1 minuut</button><span class="timer" id="xtm${i}">1:00</span></div>
       ${recHTML('x'+i, `data-xf="${i}"`)}<audio id="xau${i}" controls hidden></audio>
       <div class="stack" style="gap:6px"><span style="font-weight:700">Mijn score</span><div class="seg" role="group" aria-label="Mijn score">${[0,1,2].map(v=>`<button data-ss="${i}:${v}" aria-pressed="${(S.exam.sp||{})[i]===v}">${v}</button>`).join('')}</div></div>
       <details class="more"><summary>Voorbeeldantwoord</summary><p style="margin-top:6px">${esc(t.model)}</p></details></section>`).join('')}
     <p class="h" style="font-size:22px" id="sptot"></p>`;
    const tot=()=>{ const sp=S.exam.sp||{}; const sum=Object.values(sp).reduce((a,b)=>a+b,0); const n=Object.keys(sp).length; const el=$('#sptot'); el.textContent = n? `${sum} / 16 punten (${n}/8 gescoord)`:''; el.style.color=sum>=11?'var(--leaf-ink)':''; if(n===8){S.exam.spreken=[sum,16]; save();} };
    E.spreken.tasks.forEach((t,i)=>{
      body.querySelector(`[data-xq="${i}"]`).onclick=()=>{ if(stopFn) stopFn(); if(t.scene){ stopFn=playScene('xst'+i,[['A',t.q]],{A:t.who},()=>true); } else { stopSpeech(); speak(t.q,'f'); } };
      body.querySelector(`[data-xt="${i}"]`).onclick=()=>startTimer($('#xtm'+i),60,10,'Tijd!');
      wireFile(body.querySelector(`[data-xf="${i}"]`), $('#xau'+i)); wireRec(body.querySelector(`[data-rec="x${i}"]`), $('#xau'+i));
    });
    body.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{ const [i,v]=b.dataset.ss.split(':').map(Number); S.exam.sp=S.exam.sp||{}; S.exam.sp[i]=v; save(); b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); tot(); });
    tot();
  }
}
function examTimer(min){ const b=$('#xt'); if(!b) return; b.onclick=()=>startTimer($('#xtm'),min*60,120,'Tijd is om!'); }

const hash0=(location.hash||'').slice(1); if(/^dag\d+$/.test(hash0)){ const id=+hash0.slice(3); if(id>=1&&id<=20) view={name:'day',id,sec:firstOpen(id)}; } else if(hash0==='examen') view={name:'exam',part:'lezen'}; else if(hash0==='instellingen') view={name:'settings'};
render();
})();
</script>

</body></html>

<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stap voor Stap A1</title>
<style>
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo Bhaijaan 2";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
</style>
<style>
/* Playful learning path (Claude Design canvas v2): chunky 3D buttons, a winding day path, Tulpje the mascot, stars, stickers. */
:root{
  --paper:#F5F7FB; --sheet:#FFFFFF; --ink:#16233F; --muted:#5A6684; --line:#D9DFEC; --line-deep:#C2CADC;
  --delft:#1F4BB8; --delft-soft:#E8EEFB; --delft-deep:#163A8F; --tulip:#D9472B; --tulip-soft:#FCEAE5; --tulip-deep:#A8341D;
  --leaf:#1E7F4F; --leaf-soft:#E3F3EA; --leaf-deep:#145C39; --sun:#F2B33D; --sun-soft:#FDF2DA; --sun-deep:#C98A1A;
  --on-delft:#FFFFFF; --on-tulip:#FFFFFF; --on-leaf:#FFFFFF; --on-sun:#16233F; --tulip-ink:#B3361C; --leaf-ink:#17663F; --sun-ink:#7A5300;
  --stage1:#DCE6FB; --stage2:#F3F6FD; --skin1:#E9B98F; --skin2:#B8805A; --ring:#FFFFFF;
  --f-display:"Baloo 2","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
  --f-arh:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --sheet:#151D33; --ink:#E7ECF8; --muted:#A3AECB; --line:#2B3656; --line-deep:#1C2338;
  --delft:#7FA2FF; --delft-soft:#1E2C57; --delft-deep:#4A68C4; --tulip:#FF8A70; --tulip-soft:#3D2128; --tulip-deep:#C2604B;
  --leaf:#5FD39A; --leaf-soft:#133427; --leaf-deep:#38946A; --sun:#F5C463; --sun-soft:#3B3122; --sun-deep:#BF9133;
  --on-delft:#0E1424; --on-tulip:#0E1424; --on-leaf:#0E1424; --tulip-ink:#FF9C86; --leaf-ink:#5FD39A; --sun-ink:#F5C463;
  --stage1:#1C2747; --stage2:#121A30; --skin1:#C99A73; --skin2:#9A6B4B; --ring:#2B3656; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1424; --sheet:#151D33; --ink:#E7ECF8; --muted:#A3AECB; --line:#2B3656; --line-deep:#1C2338;
  --delft:#7FA2FF; --delft-soft:#1E2C57; --delft-deep:#4A68C4; --tulip:#FF8A70; --tulip-soft:#3D2128; --tulip-deep:#C2604B;
  --leaf:#5FD39A; --leaf-soft:#133427; --leaf-deep:#38946A; --sun:#F5C463; --sun-soft:#3B3122; --sun-deep:#BF9133;
  --on-delft:#0E1424; --on-tulip:#0E1424; --on-leaf:#0E1424; --tulip-ink:#FF9C86; --leaf-ink:#5FD39A; --sun-ink:#F5C463;
  --stage1:#1C2747; --stage2:#121A30; --skin1:#C99A73; --skin2:#9A6B4B; --ring:#2B3656; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
body.hasband::before{background:var(--delft)}
body.hasband[data-v="exam"]::before{background:var(--sun)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.h{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;text-align:right;font-size:1.1em;line-height:1.6}
.arh{font-family:var(--f-arh);font-weight:700;direction:rtl;unicode-bidi:isolate;text-align:right;line-height:1.35}
.mut{color:var(--muted)}
.small{font-size:15px}
.kick{font:800 15px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--delft);outline-offset:3px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:20px;height:20px}
.ico.xs{width:15px;height:15px;stroke-width:3}
.ico.l{width:34px;height:34px}
.ico.xl{width:50px;height:50px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.star-on{fill:var(--sun);stroke:var(--sun-deep);stroke-width:1.4;stroke-linejoin:round}
.star-off{fill:var(--line)}

/* chunky buttons */
.btn{min-height:56px;border-radius:18px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 19px/1.1 var(--f-display);border:0;text-decoration:none;text-align:center;transition:transform .08s}
.btn:active,.pc:active,.opt:active,.tile3:active{transform:translateY(3px)}
.btn-p{background:var(--delft);color:var(--on-delft);box-shadow:0 5px 0 var(--delft-deep)}
.btn-s{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line-deep)}
.btn-t{background:var(--delft-soft);color:var(--delft);box-shadow:0 4px 0 var(--line-deep)}
.btn-y{background:var(--sun);color:var(--on-sun);box-shadow:0 5px 0 var(--sun-deep)}
.btn-g{background:var(--leaf);color:var(--on-leaf);box-shadow:0 5px 0 var(--leaf-deep)}
.btn-r{background:var(--tulip);color:var(--on-tulip);box-shadow:0 5px 0 var(--tulip-deep)}
.btn-sm{min-height:48px;padding:0 14px;font-size:17px;border-radius:16px}
.btn-w{width:100%}
.btn-2{flex-direction:column;gap:0;min-height:68px;width:100%;padding-block:8px}
.btn-2 .ln{display:flex;align-items:center;gap:10px}
.btn-2 .arb{font:700 18px/1.3 var(--f-arh)}
.btn:disabled{opacity:.45;cursor:default}
.round{width:48px;min-height:48px;height:48px;padding:0;border-radius:999px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 12px;border-radius:14px;background:var(--sheet);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line-deep);font:800 18px/1 var(--f-display);color:var(--ink)}
.card{background:var(--sheet);border-radius:22px;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line-deep)}
.prog{height:16px;border-radius:999px;background:var(--line);overflow:hidden;flex:1}
.prog i{display:block;height:100%;border-radius:999px;background:var(--sun);box-shadow:inset 0 4px 0 rgba(255,255,255,.28);transition:width .3s}
.notice{border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun)}
details.more{border-top:2px dashed var(--line);padding-top:8px}
details.more>summary{font:800 17px/1.2 var(--f-display);min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--delft)}
details.more ol{margin:8px 0}
.say{display:flex;gap:6px;align-items:flex-end}
.bub2{flex:1;min-width:0;background:var(--sheet);border-radius:22px 22px 22px 6px;padding:12px 14px;box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;gap:6px}
.bub2.sun{background:var(--sun-soft);box-shadow:none}
.mascot{flex:none;display:block}

/* bottom bar + nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);box-shadow:0 -2px 0 var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{min-height:58px;border-radius:16px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 15px/1.1 var(--f-display)}
.tab .a{font:700 15px/1.2 var(--f-arh)}
.tab[aria-current="page"]{background:var(--delft-soft);color:var(--delft);box-shadow:inset 0 0 0 2px var(--delft)}
.cta{position:fixed;left:0;right:0;z-index:19;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent);padding:16px 0 10px}

/* home */
.chips{display:flex;justify-content:space-between;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 12px}
.wk{border-radius:24px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:2px}
.wkbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:10px}
.wkbars span{height:8px;border-radius:999px;overflow:hidden;display:block}
.wkbars i{display:block;height:100%;border-radius:999px}
.path{display:flex;flex-direction:column;gap:18px;padding:16px 0 220px}
.wlab{align-self:center;display:flex;flex-direction:column;align-items:center;gap:0;margin:18px 0 4px}
.wlab .k{font:800 14px/1 var(--f-display);letter-spacing:.06em;color:var(--muted)}
.wlab .n{font:800 20px/1.2 var(--f-display)}
.pn{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.pnw{display:flex;justify-content:center}
.pc{width:72px;height:72px;border-radius:999px;border:0;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .08s}
.pn-done .pc{background:var(--leaf);color:var(--on-leaf);box-shadow:0 6px 0 var(--leaf-deep)}
.pn-part .pc{background:var(--sun);color:var(--on-sun);box-shadow:0 6px 0 var(--sun-deep)}
.pn-now{margin-top:44px}
.pn-now .pc{width:84px;height:84px;background:var(--delft);color:var(--on-delft);box-shadow:0 6px 0 var(--delft-deep),0 0 0 8px var(--paper),0 0 0 13px var(--delft-soft)}
.pn-next .pc{background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--line-deep)}
.pn-exam .pc{width:96px;height:96px;background:var(--sun);color:var(--on-sun);box-shadow:0 7px 0 var(--sun-deep)}
.pl{font:800 17px/1 var(--f-display);margin-top:10px}
.pn-next .pl{color:var(--muted)}
.go{position:absolute;top:-50px;background:var(--sheet);color:var(--delft);font:800 18px/1 var(--f-display);padding:9px 16px;border-radius:14px;box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line-deep);white-space:nowrap}
.go::after,.bub::after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--sheet);transform:translateX(-50%) rotate(45deg);box-shadow:2px 2px 0 0 var(--line)}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.buddy{position:absolute;top:-18px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.bub{position:relative;background:var(--sheet);border-radius:16px;padding:8px 12px;box-shadow:0 0 0 2px var(--line);font:800 16px/1.2 var(--f-display);max-width:130px;text-align:center}

/* day */
.band{background:var(--delft);color:var(--on-delft);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 20px;border-radius:0 0 28px 28px}
.band .wrap{display:flex;flex-direction:column;gap:14px}
.bb{min-height:48px;padding:0 14px;border-radius:16px;background:var(--sheet);color:var(--ink);box-shadow:0 4px 0 var(--delft-deep);font:800 17px/1 var(--f-display);display:inline-flex;align-items:center;gap:8px;border:0}
.bb:disabled{opacity:.5}
.scn{flex:none;width:58px;height:58px;border-radius:18px;background:var(--sheet);color:var(--delft);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--delft-deep)}
.sw{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--paper);padding:14px 0 6px}
.nodes{display:flex;overflow-x:auto;scrollbar-width:none;padding:10px 4px 4px;scroll-behavior:smooth}
.nodes::-webkit-scrollbar{display:none}
.node{flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;font-family:inherit;color:var(--ink);padding:0 0 6px;position:relative}
.node .c{width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.node .l{font:800 15px/1.05 var(--f-display);margin-top:4px}
.node .a{font:700 15px/1.2 var(--f-arh)}
.node::before{content:'';position:absolute;top:24px;right:50%;width:100%;height:5px;border-radius:3px;background:var(--line);z-index:0}
.node:first-child::before{display:none}
.n-done::before,.n-now::before{background:var(--leaf)}
.n-done .c{background:var(--leaf);color:var(--on-leaf);box-shadow:0 4px 0 var(--leaf-deep)}
.n-now .c{background:var(--delft);color:var(--on-delft);box-shadow:0 4px 0 var(--delft-deep),0 0 0 5px var(--paper),0 0 0 9px var(--delft-soft)}
.n-next .c{background:var(--sheet);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line-deep)}
.n-next .l,.n-next .a{color:var(--muted)}
.node .st{position:absolute;top:-8px;left:50%;margin-left:10px;z-index:2;width:24px;height:24px}
.daymain{display:flex;flex-direction:column;gap:18px;padding-top:10px;padding-bottom:40px}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border-radius:22px;padding:14px 16px;box-shadow:0 0 0 2px var(--sun),0 4px 0 var(--sun-deep)}
.goal .gi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sun);color:var(--on-sun);display:flex;align-items:center;justify-content:center}
.lesson{background:var(--sheet);border-radius:28px;box-shadow:0 0 0 2px var(--line),0 5px 0 var(--line-deep);overflow:hidden}
.lh{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
.lic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.step{margin-left:auto;font:800 15px/1 var(--f-display);color:var(--muted);background:var(--paper);border-radius:999px;padding:8px 12px;white-space:nowrap}
.lb{padding:12px 16px 20px;display:flex;flex-direction:column;gap:16px}
.lf{padding:0 16px 22px}
.tip{background:var(--delft-soft);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tip .nl{font:800 18px/1.2 var(--f-display)}

/* words */
.deck{position:relative;padding:0 6px 14px}
.deck .b1,.deck .b2{position:absolute;left:18px;right:18px;top:12px;bottom:0;border-radius:30px}
.deck .b1{transform:rotate(-3deg);background:var(--sun)}
.deck .b2{transform:rotate(2.5deg);background:var(--delft-soft);box-shadow:inset 0 0 0 2px var(--line)}
.fc{position:relative;width:100%;min-height:300px;border-radius:30px;background:var(--sheet);box-shadow:0 0 0 2px var(--line),0 6px 0 var(--line-deep);border:0;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 18px 24px}
.fc-back{background:var(--delft-soft);box-shadow:0 0 0 3px var(--delft),0 6px 0 var(--delft-deep)}
.fc .word{font:700 44px/1.1 var(--f-body);text-align:center;overflow-wrap:anywhere}
.fc .arw{font-size:46px;line-height:1.3;font-weight:600;text-align:center}
.fc .hint{display:flex;align-items:center;gap:6px;font:800 16px var(--f-display);color:var(--muted);margin-top:8px}
.art{display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border-radius:999px;background:var(--delft);color:var(--on-delft);font:800 18px/1 var(--f-display)}
.spk{position:absolute;top:12px;right:12px;width:56px;height:56px;border-radius:999px;border:0;background:var(--delft);color:var(--on-delft);box-shadow:0 4px 0 var(--delft-deep);display:flex;align-items:center;justify-content:center;z-index:2}
.ctl .btn{flex-direction:column;gap:2px;min-height:76px;padding:6px 4px;font-size:17px}
.ctl .a{font:700 16px/1.2 var(--f-arh)}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.v{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--paper)}
.v .w{font-weight:700;font-size:18px}

/* grammar */
.tbl{overflow-x:auto;border-radius:18px;box-shadow:inset 0 0 0 2px var(--line)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{padding:10px 12px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
th{font:800 15px var(--f-display);color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
td.ar{text-align:right}
.exl{display:flex;flex-direction:column;gap:10px}

/* listening */
.stage{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,var(--stage1),var(--stage2));box-shadow:0 0 0 2px var(--line),0 5px 0 var(--line-deep)}
.stage .place{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;background:var(--sheet);border-radius:99px;padding:4px 12px 4px 6px;font:800 15px var(--f-display)}
.stage .place .e{font-size:20px}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--line);opacity:.55}
.stage .ppl{position:absolute;inset:auto 0 6% 0;display:flex;justify-content:space-around;align-items:flex-end;padding-inline:6%}
.person{display:grid;justify-items:center;gap:4px;width:30%;max-width:150px;position:relative}
.person svg{width:100%;height:auto;overflow:visible}
.person .tag{font:800 14px var(--f-display);background:var(--sheet);border-radius:99px;padding:2px 9px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.person .mouth{transform-box:fill-box;transform-origin:center}
.person.talk svg{animation:bob .5s ease-in-out infinite alternate}
.person.talk .mouth{animation:talk .18s ease-in-out infinite alternate}
.person.talk .tag{background:var(--delft);color:var(--on-delft)}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:var(--sheet);border:3px solid var(--sun);border-radius:14px;padding:6px 10px;font-size:14px;line-height:1.35;width:max-content;max-width:min(240px,62vw)}
.bubble.dots{font-size:18px;letter-spacing:2px;padding:2px 12px;color:var(--sun-deep)}
.stage .bigicon{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(34px,9vw,64px);opacity:.9}
.stage .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,16vw,120px)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}

/* ---------- writing ---------- */
function writeHTML(w,id){ return `<div class="stack wtask">${instr(w.nl,w.task,w.ar)}
  ${w.form? `<div class="formgrid">${w.form.map((f,i)=>`<label class="fl">${esc(f)}<input class="field" type="text" id="${id}-f${i}" autocomplete="off" lang="nl"></label>`).join('')}</div>` : `<label class="fl">Uw tekst<textarea class="field" id="${id}-t" placeholder="Schrijf hier in het Nederlands…" lang="nl"></textarea></label><div class="mut small" id="${id}-wc">0 woorden</div>`}
  <p class="kick mut">Controlelijst</p><div class="checks">${w.check.map((c,i)=>`<label><input type="checkbox" id="${id}-c${i}"> <span>${esc(c)}</span></label>`).join('')}</div>
  <div class="g2"><button class="btn btn-s" id="${id}-show">${ic('eye')}Voorbeeld</button><button class="btn btn-g" id="${id}-done">${ic('check')}Klaar</button></div>
  <button class="btn btn-t btn-w" id="${id}-ai" hidden>Laat Claude nakijken</button>
  <div class="model" id="${id}-model" hidden></div><div class="fb" id="${id}-fb" hidden aria-live="polite"></div></div>`; }
function studentText(w,id){ if(w.form) return w.form.map((f,i)=>`${f}: ${($('#'+id+'-f'+i)||{}).value||''}`).join('\n'); return ($('#'+id+'-t')||{}).value||''; }
function wireWrite(w,id,onDone){
  const ta=$('#'+id+'-t'); if(ta) ta.addEventListener('input',()=>{ const n=(ta.value.trim().match(/\S+/g)||[]).length; $('#'+id+'-wc').textContent=n+' woorden'; });
  $('#'+id+'-show').onclick=()=>{ const m=$('#'+id+'-model'); m.hidden=!m.hidden; m.textContent='Voorbeeld:\n'+w.model; };
  $('#'+id+'-done').onclick=()=>{ onDone&&onDone(); toast('Opgeslagen','تم الحفظ'); };
  // optional feedback from Claude
  if(window.claude && window.claude.use){ window.claude.use('sample').then(sample=>{ if(!sample) return; const b=$('#'+id+'-ai'); if(!b) return; b.hidden=false;
    b.onclick=async()=>{ const txt=studentText(w,id).trim(); const fb=$('#'+id+'-fb'); if(txt.replace(/^.*?:\s*$/gm,'').trim().length<5){ toast('Schrijf eerst uw tekst'); return; }
      fb.hidden=false; fb.textContent='Claude leest uw tekst…'; b.disabled=true;
      const lang = S.help==='nl' ? 'very simple Dutch (CEFR A1)' : (S.help==='ar' ? 'simple Arabic' : 'simple Arabic, followed by the same feedback in very simple Dutch (CEFR A1)');
      const prompt=`You are a kind, precise NT2 teacher. The learner is at CEFR A1 and is a native Arabic speaker. Check this Dutch writing task in the style of the DUO A2 writing exam: did the learner answer every point of the task?\n\nTASK (Dutch): ${w.task}\nREQUIRED POINTS: ${w.check.join('; ')}\nEXAMPLE ANSWER (for reference only): ${w.model}\n\nLEARNER TEXT:\n${txt}\n\nReply in ${lang}. Format:\n1) Points covered / missing (list each required point with ✓ or ✗).\n2) Up to 5 corrections: wrong → right, with a very short reason.\n3) The corrected Dutch text.\n4) One tip.\nKeep it short. Do not invent errors.`;
      try{ await sample(prompt,{modelTier:'default',onText:({text})=>{ fb.textContent=text; }}); }catch(e){ fb.textContent = e&&e.code==='rate_limited' ? 'Even wachten en later opnieuw proberen.' : 'Nakijken lukt nu niet. Gebruik de controlelijst en het voorbeeld.'; }
      b.disabled=false; }; }).catch(()=>{}); }
}

/* ---------- recording (Android app) ---------- */
const recIdle=()=>`<b>Tik en spreek</b>${arB('اضغط وتكلّم')}`;
function recHTML(key, fileAttr){ return CANREC ? `<div class="recwrap"><button class="recbtn" data-rec="${key}" aria-label="Neem op">${ic('mic','xl')}</button><p class="reclbl" aria-live="polite">${recIdle()}</p></div>`
  : `<label class="btn btn-s" style="align-self:flex-start">${ic('mic')}Opname kiezen of maken<input type="file" accept="audio/*" capture ${fileAttr} hidden></label>`; }
let activeRec=null;
function wireRec(btn, audio){ if(!btn) return; let mr=null, chunks=[]; const lbl=btn.parentElement.querySelector('.reclbl');
  btn.onclick=async()=>{ if(mr && mr.state==='recording'){ mr.stop(); return; }
    if(activeRec && activeRec!==btn){ toast('Stop eerst de andere opname','أوقف التسجيل الآخر أولًا'); return; }
    stopSpeech();
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); chunks=[]; mr=new MediaRecorder(st);
      mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      mr.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); activeRec=null; const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); audio.src=URL.createObjectURL(b); audio.hidden=false;
        btn.classList.remove('rec-on'); btn.innerHTML=ic('mic','xl'); btn.setAttribute('aria-label','Opnieuw opnemen'); lbl.innerHTML=`<b>Opnieuw opnemen</b>${arB('أعد التسجيل')}<span class="mut small">Luister hieronder naar uw opname.</span>`; practised(); };
      mr.start(); activeRec=btn; btn.classList.add('rec-on'); btn.innerHTML=`<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">${I.stopF}</svg>`; btn.setAttribute('aria-label','Stop opname');
      lbl.innerHTML=`<b><span class="dot" aria-hidden="true"></span>Ik luister…</b><span class="mut">Tik op het vierkant om te stoppen.</span>${arB('أستمع إليك… اضغط على المربّع للإيقاف.')}`;
      setTimeout(()=>{ if(mr&&mr.state==='recording') mr.stop(); },90000);
    }catch(e){ activeRec=null; toast('Geen toegang tot de microfoon','لا يوجد إذن للميكروفون'); } }; }
function wireFile(input, audio){ if(!input) return; input.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; audio.src=URL.createObjectURL(f); audio.hidden=false; }; }

/* ---------- speaking ---------- */
function speakHTML(s,i,n){ return `<section class="task" id="sp${i}"><p class="kick" style="color:var(--tulip-ink)">Opdracht ${i+1}${n?` van ${n}`:''}</p>
  ${sayBox(`<div class="row nowrap" style="gap:10px"><p class="pq" lang="nl" style="flex:1">${esc(s[0])}</p><button class="btn btn-p round" data-q="${i}" aria-label="Luister naar de vraag" style="width:52px;height:52px">${ic('speaker2')}</button></div>${arP(s[1],'font-size:20px')}`,'happy',72)}
  <div class="row"><button class="btn btn-s btn-sm" data-t="${i}">${ic('clock')}Start 1 minuut</button><span class="timer" id="tm${i}">1:00</span></div>
  ${recHTML('s'+i, `data-f="${i}"`)}
  <audio id="au${i}" controls hidden></audio>
  <details class="more"><summary>Voorbeeldantwoord</summary><div class="row nowrap" style="margin-top:8px;align-items:center"><button class="btn btn-t round" data-m="${i}" aria-label="Luister naar het voorbeeld">${ic('speaker')}</button><p>${esc(s[2])}</p></div></details></section>`; }
function startTimer(el,secs,lowAt,end){ clearInterval(timerInt); let t=secs; el.classList.remove('low'); const show=()=>el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; show();
  timerInt=setInterval(()=>{ t--; show(); if(t<=lowAt) el.classList.add('low'); if(t<=0){ clearInterval(timerInt); el.textContent=end; } },1000); }
function wireSpeak(s,i){ const root=$('#sp'+i);
  root.querySelector('[data-q]').onclick=()=>{stopSpeech(); speak(s[0].replace(/\(.*?\)/g,''),'f');};
  root.querySelector('[data-m]').onclick=()=>{stopSpeech(); speak(s[2].replace(/…/g,''),'m');};
  root.querySelector('[data-t]').onclick=()=>startTimer($('#tm'+i),60,10,'Tijd!');
  wireFile(root.querySelector('[data-f]'), $('#au'+i)); wireRec(root.querySelector('[data-rec]'), $('#au'+i));
}

/* ---------- EXAM ---------- */
const EXPARTS=[['lezen','Lezen',0,'القراءة','book'],['luisteren','Luisteren',0,'الاستماع','headphones'],['schrijven','Schrijven',0,'الكتابة','pencil'],['spreken','Spreken',0,'التحدّث','mic']];
function examResults(){ const E=C.EXAM, X=S.exam; if(!X.lezen&&!X.luisteren&&!X.schrijven&&!X.spreken) return '';
  const tag=(ok,txt)=>`<span class="score-tag" style="background:var(${ok?'--leaf-soft':'--sun-soft'});color:var(${ok?'--leaf-ink':'--sun-ink'})">${txt}</span>`;
  const row=(nl,s,pass)=>`<div class="sk"><span class="h" style="flex:1;font-size:18px">${nl}</span>${s?tag(s[0]>=pass,s[0]>=pass?'Goed genoeg':'Nog oefenen'):'<span class="mut small">Nog niet gedaan</span>'}<span class="h" style="width:56px;text-align:right;font-size:18px;font-variant-numeric:tabular-nums">${s?s.join('/'):'–'}</span></div>`;
  return `<section class="card" style="padding:14px 16px"><div class="gh" style="padding-bottom:6px"><h2 class="h" style="font-size:22px">Uw resultaten</h2>${arH('نتائجك','font-size:18px')}</div>
    ${row('Lezen',X.lezen,E.lezen.pass)}${row('Luisteren',X.luisteren,E.luisteren.pass)}
    <div class="sk"><span class="h" style="flex:1;font-size:18px">Schrijven</span>${X.schrijven?tag(true,'Gedaan'):'<span class="mut small">Nog niet gedaan</span>'}<span style="width:56px"></span></div>
    ${row('Spreken',X.spreken,11)}
    <p class="mut small" style="padding-top:8px">Richtlijn: Lezen ${E.lezen.pass}, Luisteren ${E.luisteren.pass}, Spreken 11 van 16 punten.</p></section>`; }
function renderExam(){ const E=C.EXAM; const part=view.part; const pi=EXPARTS.findIndex(p=>p[0]===part);
  const mins={lezen:`${E.lezen.minutes} min`,luisteren:'± 20 min',schrijven:`${E.schrijven.minutes} min`,spreken:'± 15 min'};
  app.innerHTML=`<header class="band" style="background:var(--sun);color:var(--on-sun)"><div class="wrap">
    <div class="row between"><button class="bb" data-nav="home" style="box-shadow:0 4px 0 var(--sun-deep)">${ic('x')}Stoppen</button></div>
    <div class="row nowrap" style="gap:14px"><div class="scn" style="color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-deep)">${ic('trophy','l')}</div><div style="flex:1;min-width:0"><p class="kick">Dag 21</p><h1 class="h" style="font-size:28px">Proefexamen</h1>${arH('الامتحان التجريبي','font-size:21px')}</div></div>
    <div class="stack" style="gap:4px;font-size:16px">${help(E.note,E.noteAr)}</div></div></header>
   <nav class="sw" aria-label="Onderdelen van het examen"><div class="wrap"><div class="nodes">${EXPARTS.map((p,i)=>nodeHTML(p,i,part===p[0]?'now':(S.exam[p[0]]?'done':'next'))).join('')}</div></div></nav>
   <div class="wrap daymain"><article class="lesson"><div class="lh"><div class="lic" style="background:var(--sun-soft);color:var(--sun-ink)">${ic(EXPARTS[pi][4])}</div><div style="flex:1;min-width:0"><p class="kick" style="color:var(--delft)">Proefexamen · ${EXPARTS[pi][1]}</p>${arH(EXPARTS[pi][3],'font-size:18px')}</div><span class="step">${mins[part]}</span></div>
     <div class="lb" id="exBody"></div>
     ${pi<3?`<div class="lf"><button class="btn btn-p btn-2" id="exNext">${btn2(`Volgende: ${EXPARTS[pi+1][1]}`,`التالي: ${EXPARTS[pi+1][3]}`)}</button></div>`:''}</article>${examResults()}</div>`;
  app.querySelectorAll('.nodes .node').forEach(t=>t.onclick=()=>go({name:'exam',part:t.dataset.sec}));
  const nx=$('#exNext'); if(nx) nx.onclick=()=>go({name:'exam',part:EXPARTS[pi+1][0]});
  const body=$('#exBody');
  const timerRow=min=>`<div class="row"><button class="btn btn-p" id="xt">${ic('clock')}Start ${min} min</button><span class="timer" id="xtm" role="timer">${min}:00</span></div>`;
  if(part==='lezen'){ const all=[]; E.lezen.texts.forEach(t=>t.qs.forEach(q=>all.push(q)));
    body.innerHTML=`${instr(`Lezen — ${all.length} vragen, ${E.lezen.minutes} minuten`,`Start de timer. Richtlijn: ${E.lezen.pass} van ${all.length} of meer goed = klaar voor A2.`,`شغّل المؤقت. الإرشاد: ${E.lezen.pass}/${all.length} أو أكثر = جاهز لمواد A2.`)}
     ${timerRow(E.lezen.minutes)}
     ${E.lezen.texts.map(t=>`<div class="sign"><div class="sh">${ic('book')}${esc(t.title)}</div><div class="sbody">${esc(t.text)}</div></div>`).join('')}
     ${quizAllHTML(all,'xl')}`;
    examTimer(E.lezen.minutes); wireQuizAll('xl',all,(ok,n)=>{ practised(); S.exam.lezen=[ok,n]; save(); toast(ok>=E.lezen.pass?'Goed gedaan!':'Nog even oefenen'); });
    // place each text above its questions
    let qi=0; const box=$('#xl'); const cards=[...body.querySelectorAll('.sign')]; E.lezen.texts.forEach((t,ti)=>{ const first=box.querySelector(`.q[data-qi="${qi}"]`); box.insertBefore(cards[ti],first); qi+=t.qs.length; });
  }
  if(part==='luisteren'){ const all=[]; E.luisteren.frags.forEach(f=>f.qs.forEach(q=>all.push(q)));
    body.innerHTML=`${instr(`Luisteren — ${all.length} vragen`,`Lees eerst de vragen. Speel elk fragment één keer af. Richtlijn: ${E.luisteren.pass} van ${all.length} of meer goed.`,`اقرأ الأسئلة ثم شغّل كل مقطع مرة واحدة. الإرشاد: ${E.luisteren.pass}/${all.length} أو أكثر.`)}${voiceNote()}
     ${E.luisteren.frags.map((f,fi)=>`<div class="stack"><p class="kick mut">Fragment ${fi+1}</p>${stageHTML(f.scene,f.who,'xs'+fi)}<div class="row"><button class="btn btn-p" data-xp="${fi}">${ic('play')}Afspelen</button><span class="mut small" id="xpc${fi}"></span></div></div>`).join('')}
     ${quizAllHTML(all,'xq')}`;
    let qi=0; const box=$('#xq'); E.luisteren.frags.forEach((f,fi)=>{ const blk=$('#xs'+fi).parentElement; box.insertBefore(blk, box.querySelector(`.q[data-qi="${qi}"]`)); qi+=f.qs.length; });
    const plays={}; body.querySelectorAll('[data-xp]').forEach(b=>b.onclick=()=>{ const fi=+b.dataset.xp, f=E.luisteren.frags[fi]; plays[fi]=(plays[fi]||0)+1; $('#xpc'+fi).textContent=`${plays[fi]}× afgespeeld`; if(stopFn) stopFn(); stopFn=playScene('xs'+fi,f.lines,f.who,()=>false); });
    wireQuizAll('xq',all,(ok,n)=>{ practised(); S.exam.luisteren=[ok,n]; save(); toast(ok>=E.luisteren.pass?'Goed gedaan!':'Nog even oefenen'); });
  }
  if(part==='schrijven'){
    body.innerHTML=`${instr(`Schrijven — 3 opdrachten, ${E.schrijven.minutes} minuten`,'Bij het echte A2-examen schrijft u op papier. Oefen ook op papier en vergelijk daarna met het voorbeeld. Geef antwoord op alle punten.','في امتحان A2 الحقيقي تكتب على الورق. تدرّب على الورق أيضًا ثم قارن بالنموذج. أجب عن كل نقطة.')}
     ${timerRow(E.schrijven.minutes)}
     ${E.schrijven.tasks.map((t,i)=>writeHTML(t,'xw'+i)).join('')}`;
    examTimer(E.schrijven.minutes); E.schrijven.tasks.forEach((t,i)=>wireWrite(t,'xw'+i,()=>{ practised(); S.exam.schrijven=1; save(); }));
  }
  if(part==='spreken'){
    body.innerHTML=`${instr('Spreken — 8 opdrachten','Bij elke opdracht: luister, denk 10 seconden na en antwoord maximaal 1 minuut. Geef uzelf punten: 2 = antwoord in hele zinnen, 1 = gedeeltelijk, 0 = geen antwoord. Richtlijn: 11 van 16 punten.','لكل مهمة: استمع، فكّر 10 ثوانٍ، أجب حتى دقيقة. قيّم نفسك: 2 = أجبت بجمل كاملة، 1 = جزئيًا، 0 = لا إجابة. الإرشاد: 11 من 16 نقطة.')}${voiceNote()}
     ${E.spreken.tasks.map((t,i)=>`<section class="task" id="xsp${i}"><p class="kick" style="color:var(--tulip-ink)">${esc(t.part)}</p>
       ${t.scene? stageHTML(t.scene,{A:t.who},'xst'+i) : `<div class="stage"><div class="pic" aria-hidden="true">${esc(t.pic)}</div></div>`}
       <div class="bub2"><div class="row nowrap" style="gap:10px"><p class="pq" lang="nl" style="flex:1;font-size:21px">${esc(t.q)}</p><button class="btn btn-p round" data-xq="${i}" aria-label="Luister" style="width:52px;height:52px">${ic('speaker2')}</button></div>${arP(t.ar,'font-size:19px')}</div>
       <div class="row"><button class="btn btn-s btn-sm" data-xt="${i}">${ic('clock')}1 minuut</button><span class="timer" id="xtm${i}">1:00</span></div>
       ${recHTML('x'+i, `data-xf="${i}"`)}<audio id="xau${i}" controls hidden></audio>
       <div class="stack" style="gap:6px"><span class="h" style="font-size:18px">Mijn score</span><div class="g3" role="group" aria-label="Mijn score">${[0,1,2].map(v=>`<button class="sb" data-ss="${i}:${v}" aria-pressed="${(S.exam.sp||{})[i]===v}"><span style="font-size:22px">${v}</span></button>`).join('')}</div></div>
       <details class="more"><summary>Voorbeeldantwoord</summary><p style="margin-top:6px">${esc(t.model)}</p></details></section>`).join('')}
     <p class="h" style="font-size:24px" id="sptot"></p>`;
    const tot=()=>{ const sp=S.exam.sp||{}; const sum=Object.values(sp).reduce((a,b)=>a+b,0); const n=Object.keys(sp).length; const el=$('#sptot'); el.textContent = n? `${sum} / 16 punten (${n}/8 gescoord)`:''; el.style.color=sum>=11?'var(--leaf-ink)':''; if(n===8){S.exam.spreken=[sum,16]; save();} };
    E.spreken.tasks.forEach((t,i)=>{
      body.querySelector(`[data-xq="${i}"]`).onclick=()=>{ if(stopFn) stopFn(); if(t.scene){ stopFn=playScene('xst'+i,[['A',t.q]],{A:t.who},()=>true); } else { stopSpeech(); speak(t.q,'f'); } };
      body.querySelector(`[data-xt="${i}"]`).onclick=()=>startTimer($('#xtm'+i),60,10,'Tijd!');
      wireFile(body.querySelector(`[data-xf="${i}"]`), $('#xau'+i)); wireRec(body.querySelector(`[data-rec="x${i}"]`), $('#xau'+i));
    });
    body.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{ const [i,v]=b.dataset.ss.split(':').map(Number); practised(); S.exam.sp=S.exam.sp||{}; S.exam.sp[i]=v; save(); b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); tot(); });
    tot();
  }
}
function examTimer(min){ const b=$('#xt'); if(!b) return; b.onclick=()=>startTimer($('#xtm'),min*60,300,'Tijd is om!'); }

const hash0=(location.hash||'').slice(1); if(/^dag\d+$/.test(hash0)){ const id=+hash0.slice(3); if(id>=1&&id<=20) view={name:'day',id,sec:firstOpen(id)}; } else if(hash0==='examen') view={name:'exam',part:'lezen'}; else if(['instellingen','settings'].includes(hash0)) view={name:'settings'}; else if(hash0==='stickers') view={name:'stickers'};
render();
})();
</script>

</body></html>
